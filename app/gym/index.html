": "Check the supported attempt", "text": "Eighteen divided by forty gives zero point four five moles. If you reversed the fraction or multiplied, return to the question: how much of one mole's forty-gram mass do we have? Correct the line yourself. A hint helps you learn; the next fresh attempt needs less support."}, {"title": "Change the unknown", "text": "Now the unknown is mass. Starting from n equals m divided by M, multiply both sides by M. That gives mass equals amount multiplied by molar mass. Choose the equation from the quantity requested, rather than automatically dividing."}, {"title": "Try the reverse calculation", "text": "Zero point three zero moles is the amount. First predict the mass, compared with forty grams, then write the calculation. Pause now. Explain why multiplication makes sense this time."}, {"title": "Check the mass", "text": "Amount multiplied by molar mass gives twelve grams. Three tenths of a mole has three tenths of forty grams. The result is below forty grams, as predicted. Round final numerical answers to two decimal places unless told otherwise; keep full calculator values between steps."}, {"title": "A fresh independent attempt", "text": "Carbon dioxide changes the formula. Close the previous working and solve this on paper. Count the atoms represented in the formula, then find molar mass and choose your equation. Pause before continuing. This attempt should show what you can do without a hint."}, {"title": "Diagnose your answer", "text": "The two oxygens make the molar mass forty-four grams per mole. Twenty-two grams is half that mass, so the amount is zero point five zero moles. If you used twenty-eight for molar mass, you missed the oxygen subscript. Correct the formula count first."}, {"title": "Retrieve and apply", "text": "Close the model and explain your equation choice from memory. Correct one error, then try fresh studio practice. When your teacher sets a written check, do it on your own for marking and review. Return after a gap and check whether you can still choose and use the method."}];

const AREAS={mass:'Mass and moles',mix:'Ions in mixed solutions',purity:'Percentage purity',limiting:'Limiting and excess reagents'};
const QUESTIONS=[
{id:'mass-1',area:'mass',title:'From a sample to an amount',prompt:'A sample contains <b>15,90 g of sodium carbonate, Na₂CO₃</b>. Calculate the amount of Na₂CO₃ in the sample.',given:'Use Na = 23; C = 12; O = 16.',answer:.15,unit:'mol',reason:'mass',hints:['Find the mass of one mole by counting every atom in Na₂CO₃.','M(Na₂CO₃) = 2(23) + 12 + 3(16). Now choose a relationship for amount.','The amount is the sample mass divided by 106. Keep the final unit mol.'],solution:[['Molar mass','M = 2(23) + 12 + 3(16) = 106 g·mol⁻¹'],['Formula',`n = ${frac('m','M')}`],['Substitute',`n = ${frac('15,90','106')}`],['Answer','n = 0,15 mol']],rubric:['Correct molar mass from the formula','Equation for the unknown','Correct numerical substitution','Answer with mol; two decimal places'],ref:'Adapted from Worked Example 14.3, coursebook p. 294.',trap:'Using 4,24? Check the sodium subscript before calculating molar mass.'},
{id:'mass-2',area:'mass',title:'Choose the unknown',prompt:'A sample contains <b>0,35 mol of sodium carbonate, Na₂CO₃</b>. Calculate its mass.',given:'Use Na = 23; C = 12; O = 16.',answer:37.1,unit:'g',reason:'reverse',hints:['This question asks for mass, not amount. What must happen to n = m/M?','Multiply both sides of n = m/M by M: m = nM.','Multiply 0,35 by 106.'],solution:[['Molar mass','M = 2(23) + 12 + 3(16) = 106 g·mol⁻¹'],['Rearrange','nM = m; therefore m = nM'],['Substitute','m = (0,35)(106)'],['Answer','m = 37,10 g']],rubric:['Correct molar mass','Correct rearrangement','Numerical substitution','Answer in grams'],ref:'New reverse-calculation variant of coursebook section 14.2, p. 294.'},
{id:'mass-3',area:'mass',title:'A different compound',prompt:'Calculate the amount of substance in <b>19,60 g of sulfuric acid, H₂SO₄</b>.',given:'Use H = 1; S = 32; O = 16.',answer:.2,unit:'mol',reason:'mass',hints:['The formula contains two H atoms, one S atom and four O atoms.','M(H₂SO₄) = 2(1) + 32 + 4(16) = 98 g·mol⁻¹.','Use n = m/M, with the mass in grams.'],solution:[['Molar mass','M = 2(1) + 32 + 4(16) = 98 g·mol⁻¹'],['Formula',`n = ${frac('m','M')}`],['Substitute',`n = ${frac('19,60','98')}`],['Answer','n = 0,20 mol']],rubric:['All formula subscripts counted','Appropriate equation','Correct substitution','Answer and unit'],ref:'New variant combining Worked Examples 14.1 and 14.3, pp. 293–294.'},
{id:'mass-4',area:'mass',title:'Brackets matter',prompt:'Calculate the amount of <b>magnesium hydroxide, Mg(OH)₂</b>, in a sample of mass <b>11,66 g</b>.',given:'Use Mg = 24,3; O = 16; H = 1.',answer:.2,unit:'mol',reason:'mass',hints:['The 2 after the bracket multiplies O and H.','M = 24,3 + 2(16 + 1) = 58,3 g·mol⁻¹.','Divide 11,66 by 58,3.'],solution:[['Molar mass','M = 24,3 + 2(16 + 1) = 58,3 g·mol⁻¹'],['Formula',`n = ${frac('m','M')}`],['Substitute',`n = ${frac('11,66','58,3')}`],['Answer','n = 0,20 mol']],rubric:['Bracket multiplier applied to both elements','Correct equation','Correct substitution','Answer with unit'],ref:'Extends Now you, coursebook p. 293, into section 14.2.'},

<script>
/* School window bridge. The open app never signs anyone in and keeps progress on this device.
   When a school opens it inside its own signed-in "window" page, results are passed up to that page,
   which adds the pupil's school identity and records them. Outside a school window, SYNC stays undefined. */
(function(){
  if (window.parent === window) return;
  var parentOrigin = null, timer = null, pending = null;
  function post(msg){ if (parentOrigin) window.parent.postMessage(msg, parentOrigin); }
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (d.type !== 'mrr-hello' || !/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(e.origin)) return;
    parentOrigin = e.origin;
    window.SYNC = {
      save: function(state){ pending = state; clearTimeout(timer); timer = setTimeout(function(){ post({type:'mrr-save', state: pending}); }, 1500); },
      log: function(rec){ post({type:'mrr-log', rec: rec}); }
    };
    if (window.LADDER && d.state) { LADDER.merge(d.state); window.dispatchEvent(new HashChangeEvent('hashchange')); }
    var note = document.getElementById('storage-note');
    if (note && d.school) { note.hidden = true; note.insertAdjacentHTML('afterend', '<span class="who">Linked to ' + String(d.school).replace(/[<>&"]/g,'') + ': your results go to your teacher</span>'); }
  });
  window.parent.postMessage({type:'mrr-ready'}, '*');
})();
</script>

<script>
/* Mr Robert's Science v0.3 · "Climb the ladder": generated, step-by-step practice with faded worked examples.
   Every question is built fresh from coursebook data-sheet values, so no two pupils get identical numbers.

'use strict';
(function(root){
const ATOM={H:1,C:12,N:14,O:16,Na:23,Mg:24.3,Al:27,S:32,Cl:35.5,K:39,Ca:40,Fe:56,Cu:63.5,Zn:65.4};
const r2=x=>Math.round(x*100)/100;
const c2=(x,dp=2)=>x.toFixed(dp).replace('.',',');
const c3=x=>String(Math.round(x*10000)/10000).replace('.',',');
const frac=(a,b)=>`<span class="fraction"><span>${a}</span><span>${b}</span></span>`;
const pick=(a,rng)=>a[Math.floor(rng()*a.length)];
const range=(from,to,step)=>{const o=[];for(let x=from;x<=to+1e-9;x+=step)o.push(Math.round(x*1000)/1000);return o;};
function molar(parts){return parts.reduce((s,[el,k])=>s+ATOM[el]*k,0);}
function molarExpr(parts){return parts.map(([el,k])=>k===1?`${c3(ATOM[el])}`:`${k}(${c3(ATOM[el])})`).join(' + ');}
function given(parts){return 'Use '+[...new Set(parts.map(p=>p[0]))].map(el=>`${el} = ${c3(ATOM[el])}`).join('; ')+'.';}

const COMPOUNDS=[
 {f:'Na₂CO₃',name:'sodium carbonate',use:'washing soda',parts:[['Na',2],['C',1],['O',3]]},
 {f:'NaHCO₃',name:'sodium hydrogen carbonate',use:'the baking soda in a cake',parts:[['Na',1],['H',1],['C',1],['O',3]]},
 {f:'CaCO₃',name:'calcium carbonate',use:'an antacid tablet',parts:[['Ca',1],['C',1],['O',3]]},
 {f:'Mg(OH)₂',name:'magnesium hydroxide',use:'milk of magnesia',parts:[['Mg',1],['O',2],['H',2]],expr:'24,3 + 2(16 + 1)'},
 {f:'H₂SO₄',name:'sulfuric acid',use:'a car battery',parts:[['H',2],['S',1],['O',4]]},
 {f:'NaCl',name:'sodium chloride',use:'table salt',parts:[['Na',1],['Cl',1]]},
 {f:'CO₂',name:'carbon dioxide',use:'a fizzy-drink canister',parts:[['C',1],['O',2]]},
 {f:'NH₄Cl',name:'ammonium chloride',use:'a dry-cell battery paste',parts:[['N',1],['H',4],['Cl',1]]},
 {f:'CuSO₄',name:'copper(II) sulfate',use:'a pool algaecide',parts:[['Cu',1],['S',1],['O',4]]},
 {f:'Al₂O₃',name:'aluminium oxide',use:'the coating on a phone case',parts:[['Al',2],['O',3]]}
];

/* Each generator returns {area,title,prompt,given,steps,final}. A step is
   {label, kind:'num'|'choice', answer, unit?, options?, why?, model, hint}. */
function genMass(rng){const c=pick(COMPOUNDS,rng),M=molar(c.parts),n=pick(range(.1,.75,.05),rng),m=r2(n*M),ans=m/M;
 return {area:'mass',title:'From grams to moles',prompt:`You have <b>${c2(m)} g of ${c.name}, ${c.f}</b> (${c.use}). Calculate the amount of ${c.f} in moles.`,given:given(c.parts),
 steps:[
  {label:`Molar mass of ${c.f}`,kind:'num',answer:M,unit:'g·mol⁻¹',model:`M(${c.f}) = ${c.expr||molarExpr(c.parts)} = ${c3(M)} g·mol⁻¹`,hint:`Count every atom in ${c.f}; a subscript or a bracket multiplies.`},
  {label:'Choose the relationship',kind:'choice',options:['n = m/M','n = m × M','n = M/m'],answer:0,why:['','Check the units: g × g·mol⁻¹ does not give mol.','That is upside down: g·mol⁻¹ ÷ g does not give mol.'],model:`n = ${frac('m','M')}`,hint:'Which way round makes the units come out in mol?'},
  {label:'Substitute and calculate n',kind:'num',answer:ans,unit:'mol',final:true,model:`n = ${frac(c2(m),c3(M))} = ${c2(ans)} mol`,hint:`Divide the sample mass by the molar mass you found.`}
 ]};}
function genReverse(rng){const c=pick(COMPOUNDS,rng),M=molar(c.parts),n=pick(range(.1,.9,.05),rng),ans=n*M;
 return {area:'reverse',title:'From moles to grams',prompt:`A recipe needs <b>${c2(n)} mol of ${c.name}, ${c.f}</b> (${c.use}). What mass must you weigh out?`,given:given(c.parts),
 steps:[
  {label:`Molar mass of ${c.f}`,kind:'num',answer:M,unit:'g·mol⁻¹',model:`M(${c.f}) = ${c.expr||molarExpr(c.parts)} = ${c3(M)} g·mol⁻¹`,hint:`Count every atom in ${c.f}.`},
  {label:'Rearrange for mass',kind:'choice',options:['m = nM','m = n/M','m = M/n'],answer:0,why:['','Start from n = m/M and multiply both sides by M.','Start from n = m/M and multiply both sides by M.'],model:'n = m/M, so m = nM',hint:'Multiply both sides of n = m/M by M.'},
  {label:'Substitute and calculate m',kind:'num',answer:ans,unit:'g',final:true,model:`m = (${c2(n)})(${c3(M)}) = ${c2(ans)} g`,hint:'Multiply the amount by the molar mass.'}
 ]};}
const SALT1=[{f:'NaCl',k:1},{f:'KCl',k:1}],SALT2=[{f:'CaCl₂',k:2},{f:'MgCl₂',k:2},{f:'AlCl₃',k:3}];
function genMix(rng){const a=pick(SALT1,rng),b=pick(SALT2,rng),ca=pick([.1,.15,.2,.25,.3],rng),cb=pick([.05,.1,.15,.2],rng),va=pick([50,100,150,200],rng),vb=pick([50,100,150,200],rng);
 const na=ca*va/1000,nb=cb*vb/1000,ncl=na*a.k+nb*b.k,V=(va+vb)/1000,c=ncl/V;
 return {area:'mix',title:'Count the chloride ions',prompt:`Pool water is tested by mixing solutions. Mix <b>${va} cm³ of ${c2(ca)} mol·dm⁻³ ${a.f}</b> with <b>${vb} cm³ of ${c2(cb)} mol·dm⁻³ ${b.f}</b>. Assume complete dissociation, no reaction and that volumes add. Calculate the final <b>chloride ion concentration</b>.`,given:'Volumes in dm³: divide cm³ by 1 000.',
 steps:[
  {label:`Amount of ${a.f}`,kind:'num',answer:na,unit:'mol',model:`n = cV = (${c2(ca)})(${c3(va/1000)}) = ${c3(na)}${na<.01?'':''} mol`,hint:'n = cV, with V in dm³.'},
  {label:`Amount of ${b.f}`,kind:'num',answer:nb,unit:'mol',model:`n = cV = (${c2(cb)})(${c3(vb/1000)}) = ${c3(nb)} mol`,hint:'Same method: n = cV, V in dm³.'},
  {label:`Cl⁻ ions from one formula unit of ${b.f}`,kind:'choice',options:['1','2','3'],answer:b.k-1,why:['Read the subscript on Cl.','Read the subscript on Cl.','Read the subscript on Cl.'],model:`${b.f} → … + ${b.k}Cl⁻`,hint:`Write the dissociation of ${b.f}.`},
  {label:'Total amount of Cl⁻',kind:'num',answer:ncl,unit:'mol',model:`n(Cl⁻) = ${c3(na)} + ${b.k}(${c3(nb)}) = ${c3(r2(ncl*1000)/1000)} mol`,hint:'Add the chloride from both solutions, using each ion ratio. Add amounts, never concentrations.'},
  {label:'Total volume',kind:'num',answer:V,unit:'dm³',model:`V = ${c3(va/1000)} + ${c3(vb/1000)} = ${c3(V)} dm³`,hint:'Add the two volumes, in dm³.'},
  {label:'Chloride ion concentration',kind:'num',answer:c,unit:'mol·dm⁻³',final:true,model:`c(Cl⁻) = ${frac('n','V')} = ${frac(c3(ncl),c3(V))} = ${c2(c)} mol·dm⁻³`,hint:'c = n/V using the total chloride amount and the total volume.'}
 ]};}
const PURE=[{x:'MgO',name:'magnesium oxide',parts:[['Mg',1],['O',1]],acid:'HCl',k:2,eq:'MgO + 2HCl → MgCl₂ + H₂O'},{x:'CaCO₃',name:'calcium carbonate (limestone)',parts:[['Ca',1],['C',1],['O',3]],acid:'HCl',k:2,eq:'CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂'},{x:'ZnO',name:'zinc oxide (sunscreen powder)',parts:[['Zn',1],['O',1]],acid:'H₂SO₄',k:1,eq:'ZnO + H₂SO₄ → ZnSO₄ + H₂O'},{x:'CuO',name:'copper(II) oxide',parts:[['Cu',1],['O',1]],acid:'H₂SO₄',k:1,eq:'CuO + H₂SO₄ → CuSO₄ + H₂O'}];
function genPurity(rng){const s=pick(PURE,rng),ca=pick([.5,1,1.5,2],rng),va=pick(range(50,250,25),rng),na=ca*va/1000,nx=na/s.k,M=molar(s.parts),mx=nx*M,p=.55+rng()*.4,sample=r2(mx/p),ans=mx/sample*100;
 return {area:'purity',title:'Only the pure part reacts',prompt:`A <b>${c2(sample)} g impure sample of ${s.name}, ${s.x}</b>, reacts completely with exactly <b>${va} cm³ of ${c2(ca)} mol·dm⁻³ ${s.acid}</b>. The impurities do not react. Calculate the <b>percentage purity</b>.<br>${s.eq}`,given:given(s.parts)+' Keep calculator values unrounded between steps.',
 steps:[
  {label:`Amount of ${s.acid}`,kind:'num',answer:na,unit:'mol',model:`n(${s.acid}) = cV = (${c2(ca)})(${c3(va/1000)}) = ${c3(na)} mol`,hint:'n = cV with V in dm³.'},
  {label:`Mole ratio ${s.x} : ${s.acid}`,kind:'choice',options:['1 : 1','1 : 2','2 : 1'],answer:s.k===1?0:1,why:['Look at the coefficients in the balanced equation.','Look at the coefficients in the balanced equation.','Look at the coefficients in the balanced equation.'],model:`n(${s.x}) : n(${s.acid}) = 1 : ${s.k}`,hint:'Read the coefficients from the balanced equation.'},
  {label:`Amount of pure ${s.x}`,kind:'num',answer:nx,unit:'mol',model:s.k===1?`n(${s.x}) = n(${s.acid}) = ${c3(nx)} mol`:`n(${s.x}) = ½ × ${c3(na)} = ${c3(nx)} mol`,hint:'Use the ratio to convert the acid amount into the amount of the pure substance.'},
  {label:`Molar mass of ${s.x}`,kind:'num',answer:M,unit:'g·mol⁻¹',model:`M(${s.x}) = ${molarExpr(s.parts)} = ${c3(M)} g·mol⁻¹`,hint:`Add the atomic masses in ${s.x}.`},
  {label:`Mass of pure ${s.x}`,kind:'num',answer:mx,unit:'g',model:`m = nM = (${c3(nx)})(${c3(M)}) = ${c3(mx)} g`,hint:'m = nM.'},
  {label:'Percentage purity',kind:'num',answer:ans,unit:'%',final:true,model:`% purity = ${frac(c3(mx),c2(sample))} × 100 = ${c2(ans)} %`,hint:'Pure mass ÷ ORIGINAL sample mass × 100.'}
 ]};}
const LIM=[{a:'Zn',b:'HCl',ca:1,cb:2,eq:'Zn + 2HCl → ZnCl₂ + H₂',bName:'HCl'},{a:'Mg',b:'HCl',ca:1,cb:2,eq:'Mg + 2HCl → MgCl₂ + H₂',bName:'HCl'},{a:'Al',b:'Cl₂',ca:2,cb:3,eq:'2Al + 3Cl₂ → 2AlCl₃',bName:'Cl₂'},{a:'Fe',b:'S',ca:1,cb:1,eq:'Fe + S → FeS',bName:'S'}];
function genLimiting(rng){const s=pick(LIM,rng),MA=ATOM[s.a];let nA0=pick(range(.1,.5,.05),rng);const mA=r2(nA0*MA),nA=mA/MA;const f=pick([.6,.75,1.25,1.5],rng),nB=r2(nA/s.ca*f*s.cb);
 const aLim=nA/s.ca<nB/s.cb;const lim=aLim?s.a:s.b,exc=aLim?s.b:s.a;const nLim=aLim?nA:nB,cLim=aLim?s.ca:s.cb,cExc=aLim?s.cb:s.ca,nExc0=aLim?nB:nA;const react=nLim*cExc/cLim,left=nExc0-react;
 const steps=[
  {label:`Amount of ${s.a}`,kind:'num',answer:nA,unit:'mol',model:`n(${s.a}) = ${frac(c2(mA),c3(MA))} = ${c2(nA,4)} mol`,hint:'n = m/M.'},
  {label:'Which reagent is limiting?',kind:'choice',options:[s.a,s.b],answer:aLim?0:1,why:['Compare n ÷ coefficient for each reactant. The smaller value runs out first.','Compare n ÷ coefficient for each reactant. The smaller value runs out first.'],model:`${s.a}: ${c2(nA,4)} ÷ ${s.ca} = ${c2(nA/s.ca,4)}; ${s.b}: ${c2(nB)} ÷ ${s.cb} = ${c2(nB/s.cb,4)}. ${lim} is limiting.`,hint:'More moles does not mean excess: divide each amount by its coefficient first.'},
  {label:`Amount of ${exc} that reacts`,kind:'num',answer:react,unit:'mol',model:`n(${exc} reacted) = ${frac(String(cExc),String(cLim))} × ${c2(nLim,4)} = ${c2(react,4)} mol`,hint:`Use the ${s.ca}:${s.cb} ratio from the equation, starting from the limiting reagent.`},
  {label:`Amount of ${exc} left over`,kind:'num',answer:left,unit:'mol',final:aLim,model:`n(${exc} left) = ${c2(nExc0,4)} − ${c2(react,4)} = ${c2(left,4)} mol`,hint:'Initial amount − amount reacted.'}];
 if(!aLim)steps.push({label:`Mass of ${s.a} left over`,kind:'num',answer:left*MA,unit:'g',final:true,model:`m = nM = (${c2(left,4)})(${c3(MA)}) = ${c2(left*MA)} g`,hint:'m = nM with the leftover amount.'});
 return {area:'limiting',title:'What is left over?',prompt:`Mix <b>${c2(mA)} g of ${s.a}</b> with <b>${c2(nB)} mol of ${s.bName}</b>. The reaction runs to completion.<br>${s.eq}<br>Find the limiting reagent, then calculate how much of the excess reagent is left over${aLim?' (in mol)':` (as a mass of ${s.a})`}.`,given:`Use ${s.a} = ${c3(MA)}. Keep unrounded values between steps.`,steps};}

const TOPICS={mass:{name:'Grams → moles',tag:'14.2',gen:genMass,blurb:'The move every calculation starts with.'},reverse:{name:'Moles → grams',tag:'14.2',gen:genReverse,blurb:'Flip the relationship.'},mix:{name:'Ions in a mixture',tag:'14.5 · Nov Q3',gen:genMix,blurb:'Count the ions, then use the total volume.'},purity:{name:'Percentage purity',tag:'14.12 · Nov Q3',gen:genPurity,blurb:'Only the pure part reacts.'},limiting:{name:'Limiting & excess',tag:'14.9–14.10 · Nov Q3',gen:genLimiting,blurb:'Who runs out first, and what is left?'}};

/* A numerical step is right if it is within 1 % of the exact value; a final answer may also be the exact 2-decimal rounding. */
function parseNum(v){const s=String(v).trim().replace(',','.').replace('−','-');return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN;}
/* Momentum answers carry a sign. A phone's number pad may have no minus key, so signed answers get a ± key. */
function signSlip(value,answer){const x=parseNum(value);return Number.isFinite(x)&&Math.abs(answer)>1e-9&&Math.sign(x)!==Math.sign(answer)&&stepCorrect(String(-x),answer,true);}
function signed(topic){return (TOPICS[topic]||{}).mod==='7-8';}
function pmKey(topic){return signed(topic)?'<button type="button" class="secondary pm" data-pm aria-label="Change the sign">±</button>':'';}

document.addEventListener('click',e=>{const b=e.target.closest('[data-pm]');if(!b)return;const i=b.parentNode.querySelector('input');if(!i||i.disabled)return;const v=i.value.trim();i.value=/^[-−]/.test(v)?v.replace(/^[-−]\s*/,''):'−'+v;i.dispatchEvent(new Event('input',{bubbles:true}));i.focus();});
function stepCorrect(value,answer,final){const x=parseNum(value);if(!Number.isFinite(x))return false;if(Math.abs(x-answer)<=Math.abs(answer)*.01+1e-9)return true;return !!final&&Math.abs(x-r2(answer))<1e-9;}

<script>
/* Mr Robert's Science v0.3 · Momentum ladder topics (coursebook Modules 7 and 8, SAGS 29/31).
   Fresh numbers every time. Every question starts by fixing a positive direction, because signs are where marks are lost.
   Loads after ladder.js and adds its topics to LADDER.TOPICS (mod:'7-8'). */
'use strict';
(function(root){
const r2=x=>Math.round(x*100)/100;
const c2=(x,dp=2)=>{const v=Math.round(x*10**dp)/10**dp;return (Object.is(v,-0)?0:v).toFixed(dp).replace('.',',');};
const cs=x=>{const v=Math.round(x*1000)/1000;return String(Object.is(v,-0)?0:v).replace('.',',').replace('-','−');};   /* short signed number, e.g. −3,5 */
const frac=(a,b)=>`<span class="fraction"><span>${a}</span><span>${b}</span></span>`;
const pick=(a,rng)=>a[Math.floor(rng()*a.length)];
const U='kg·m·s⁻¹',V='m·s⁻¹';
const dirWord=(v,pos)=>v===0?'':v>0?pos:(pos==='east'?'west':'east');
const par=x=>x<0?`(${cs(x)})`:cs(x);
const POS=['east','west'];
const signStep=(what,isPos,pos)=>({label:`Sign of ${what}`,kind:'choice',options:['+ (same way as positive)','− (opposite to positive)'],answer:isPos?0:1,
  why:['Look again: which way does it move compared with the positive direction you were given?','Look again: which way does it move compared with the positive direction you were given?'],
  model:`${pos} is positive, so ${what} is ${isPos?'positive (+)':'negative (−)'}.`,hint:`Moving ${pos} gets a +. Moving the other way gets a −.`});

/* 7.1 p = mv with conversions */
const OBJ=[{n:'cricket ball',g:[156,160],kmh:[108,126,135,144]},{n:'hockey ball',g:[160,163],kmh:[54,72,90]},{n:'tennis ball',g:[57,58],kmh:[90,108,144,162]},{n:'netball',g:[400,420],kmh:[18,27,36]},{n:'rugby ball',g:[410,440],kmh:[36,45,54]}];
function genP(rng){const o=pick(OBJ,rng),pos=pick(POS,rng),g=pick(o.g,rng),kmh=pick(o.kmh,rng),moves=pick(POS,rng);const m=g/1000,vs=kmh/3.6,v=moves===pos?vs:-vs,p=m*v;
 return {area:'mom-p',title:'Momentum with a direction',prompt:`A ${o.n} of mass <b>${g} g</b> moves <b>${moves}</b> at <b>${kmh} km·h⁻¹</b>. Take <b>${pos} as positive</b>. Calculate its momentum.`,given:'Convert g → kg (÷ 1 000) and km·h⁻¹ → m·s⁻¹ (÷ 3,6) first.',
 steps:[
  {label:'Mass in kg',kind:'num',answer:m,unit:'kg',model:`m = ${frac(g,'1 000')} = ${c2(m,3)} kg`,hint:'Divide grams by 1 000.'},
  signStep('the velocity',v>0,pos),
  {label:'Velocity in m·s⁻¹ (with its sign)',kind:'num',answer:v,unit:V,model:`v = ${frac(kmh,'3,6')} = ${c2(vs)} m·s⁻¹ ${moves}, so v = ${cs(r2(v))} m·s⁻¹`,hint:'Divide km·h⁻¹ by 3,6, then put the sign in front.'},
  {label:'p = mv',kind:'num',answer:p,unit:U,final:true,model:`p = mv = (${c2(m,3)})(${cs(r2(v))}) = ${cs(r2(p))} ${U}, i.e. ${c2(Math.abs(p))} ${U} ${moves}`,hint:'Multiply. Keep the sign: it tells the direction.'}]};}

/* 7.2 + 7.3 Δp when an object bounces back, then Fnet = Δp/Δt */
const BOUNCE=[{n:'tennis ball',m:[.057,.058],u:[15,18,20,24],f:[.5,.6,.7],t:[.004,.005,.006]},{n:'squash ball',m:[.024,.025],u:[20,25,30],f:[.4,.5,.6],t:[.003,.004]},{n:'cricket ball',m:[.156,.16],u:[20,25,30],f:[.3,.4,.5],t:[.002,.003,.004]},{n:'basketball',m:[.6,.62],u:[4,5,6],f:[.6,.7,.8],t:[.02,.025,.03]}];
function genDeltaP(rng){const o=pick(BOUNCE,rng),pos=pick(POS,rng),m=pick(o.m,rng),us=pick(o.u,rng),vs=r2(us*pick(o.f,rng)),dt=pick(o.t,rng);
 const into=pick(POS,rng),back=into==='east'?'west':'east';const u=into===pos?us:-us,v=back===pos?vs:-vs,dp=m*(v-u),F=dp/dt;
 return {area:'mom-dp',title:'Bounce off a wall',prompt:`A ${o.n} of mass <b>${c2(m,3)} kg</b> hits a wall moving <b>${into}</b> at <b>${us} m·s⁻¹</b> and rebounds <b>${back}</b> at <b>${c2(vs)} m·s⁻¹</b>. It is in contact with the wall for <b>${c2(dt,3)} s</b>. Take <b>${pos} as positive</b>. Calculate the change in momentum and the average net force on the ball.`,given:'Δp = mv − mu (final minus initial). Fnet = Δp/Δt.',
 steps:[
  {label:'Initial velocity u (with sign)',kind:'num',answer:u,unit:V,model:`u = ${cs(u)} m·s⁻¹ (${into})`,hint:`It moves ${into} before the bounce. ${pos} is positive.`},
  {label:'Final velocity v (with sign)',kind:'num',answer:v,unit:V,model:`v = ${cs(v)} m·s⁻¹ (${back})`,hint:'After the bounce it moves the other way, so the sign flips.'},
  {label:'Choose the relationship',kind:'choice',options:['Δp = m(v − u)','Δp = m(u − v)','Δp = m(v + u) with both speeds positive'],answer:0,why:['','That is initial minus final. Always final minus initial.','Adding speeds can give the right size by luck, but the method mark needs signed velocities in m(v − u).'],model:`Δp = m(v − u)`,hint:'Change = final − initial.'},
  {label:'Δp',kind:'num',answer:dp,unit:U,model:`Δp = (${c2(m,3)})(${cs(v)} − ${par(u)}) = ${cs(r2(dp))} ${U}`,hint:'Substitute the signed values. Minus a negative is plus.'},
  {label:'Average net force Fnet = Δp/Δt',kind:'num',answer:F,unit:'N',final:true,model:`Fnet = ${frac(cs(dp),c2(dt,3))} = ${cs(r2(F))} N, i.e. ${c2(Math.abs(F))} N ${dirWord(F,pos)}`,hint:'Divide Δp by the contact time. The sign gives the direction of the force.'}]};}

/* 7.4 impulse in everyday life: stopping */
const STOP=[{n:'A 70 kg crash-test dummy',m:[70],u:[10,12,15,20],t:[.04,.08,.1,.15],ctx:'is brought to rest by an airbag'},{n:'A cricket ball of mass 0,16 kg',m:[.16],u:[20,25,30],t:[.01,.05,.1,.2],ctx:'is caught by a fielder whose hands move back'},{n:'A 1 200 kg car',m:[1200],u:[10,15,20],t:[.1,.2,.5],ctx:'hits a crash barrier and stops'},{n:'A 0,45 kg soccer ball',m:[.45],u:[8,10,12],t:[.02,.05,.1],ctx:'is stopped by a goalkeeper'}];
function genStop(rng){const o=pick(STOP,rng),pos=pick(POS,rng),m=pick(o.m,rng),us=pick(o.u,rng),dt=pick(o.t,rng),moves=pick(POS,rng);const u=moves===pos?us:-us,dp=m*(0-u),F=dp/dt;
 return {area:'mom-stop',title:'Impulse: bringing it to rest',prompt:`${o.n} moving <b>${moves}</b> at <b>${us} m·s⁻¹</b> ${o.ctx} in <b>${c2(dt,2)} s</b>. Take <b>${pos} as positive</b>. Calculate the impulse and the average net force.`,given:'Impulse = FnetΔt = Δp = m(v − u). Final velocity is 0.',
 steps:[
  signStep('the initial velocity',u>0,pos),
  {label:'Impulse (= Δp)',kind:'num',answer:dp,unit:'N·s',model:`Δp = m(v − u) = (${cs(m)})(0 − ${par(u)}) = ${cs(r2(dp))} N·s`,hint:'Final velocity is 0. Final minus initial.'},
  {label:'Why it matters',kind:'choice',options:['A longer stopping time gives a smaller average force for the same Δp','A longer stopping time makes Δp smaller','A longer stopping time makes the impulse bigger'],answer:0,why:['','Δp is fixed by the velocities before and after. Only the time can change.','The impulse equals Δp, which is fixed by the velocities.'],model:'Same Δp, longer Δt, so a smaller average Fnet. That is why airbags, padded gloves and "giving" with your hands work.',hint:'Which quantity can the airbag or the hands actually change?'},
  {label:'Average net force',kind:'num',answer:F,unit:'N',final:true,model:`Fnet = ${frac(cs(dp),c2(dt,2))} = ${cs(r2(F))} N, i.e. ${c2(Math.abs(F))} N ${dirWord(F,pos)}`,hint:'Fnet = Δp/Δt.'}]};}

/* 8.2 stick together */
const MASSES=[.5,1,1.5,2,2.5,3,4,5];
function genStick(rng){const pos=pick(POS,rng),mA=pick(MASSES,rng),mB=pick(MASSES,rng),uAs=pick([2,3,4,5,6],rng),uBs=pick([0,0,1,2,3],rng);const aDir=pick(POS,rng),bDir=uBs?pick(POS,rng):aDir;
 const toward=aDir==='east'?'west':'east';const bD=uBs?(rng()<.6?toward:aDir):aDir;const uA=aDir===pos?uAs:-uAs;let uB=bD===pos?uBs:-uBs;
 if(bD===aDir&&uBs>=uAs)uB=0; /* B must not run away from A */
 const pT=mA*uA+mB*uB,v=pT/(mA+mB);
 return {area:'mom-stick',title:'Collide and stick together',prompt:`Trolley A (<b>${cs(mA)} kg</b>) moves <b>${aDir}</b> at <b>${uAs} m·s⁻¹</b>. Trolley B (<b>${cs(mB)} kg</b>) ${uB?`moves <b>${uB>0===(pos==='east')?'east':'west'}</b> at <b>${Math.abs(uB)} m·s⁻¹</b>`:'is <b>at rest</b>'}. They collide and stick together. Ignore friction. Take <b>${pos} as positive</b>. Calculate their velocity after the collision.`,given:'Σp before = Σp after (isolated system).',
 steps:[
  {label:'Total momentum before',kind:'num',answer:pT,unit:U,model:`Σp before = (${cs(mA)})(${cs(uA)}) + (${cs(mB)})(${cs(uB)}) = ${cs(r2(pT))} ${U}`,hint:'Add the two momenta, each with its sign.'},
  {label:'Choose the relationship',kind:'choice',options:['Σp before = (mA + mB)v','Σp before = mA·v + mB','Each trolley keeps its own momentum'],answer:0,why:['','Both trolleys move together, so both masses multiply the same v.','Only the TOTAL is conserved. Each trolley’s momentum changes.'],model:`Σp before = Σp after = (m_A + m_B)v`,hint:'After sticking, they move as one object.'},

function genBounceApart(rng){const pos=pick(POS,rng),mA=pick(MASSES,rng),mB=pick(MASSES,rng),uAs=pick([3,4,5,6],rng),aDir=pick(POS,rng);const uA=aDir===pos?uAs:-uAs,uB=0;
 const e=pick([1,.8,.6,.5],rng);const vA=r2((mA*uA-mB*e*uA)/(mA+mB));const vB=(mA*uA-mA*vA)/mB;const pT=mA*uA;
 const aAfter=vA===0?'stops':`moves <b>${dirWord(vA,pos)}</b> at <b>${c2(Math.abs(vA))} m·s⁻¹</b>`;
 return {area:'mom-bounce',title:'Bounce apart',prompt:`Trolley A (<b>${cs(mA)} kg</b>) moves <b>${aDir}</b> at <b>${uAs} m·s⁻¹</b> and collides with stationary trolley B (<b>${cs(mB)} kg</b>). After the collision A ${aAfter}. Ignore friction. Take <b>${pos} as positive</b>. Calculate the velocity of B after the collision.`,given:'Σp before = Σp after.',
 steps:[
  {label:'Total momentum before',kind:'num',answer:pT,unit:U,model:`Σp before = (${cs(mA)})(${cs(uA)}) + 0 = ${cs(r2(pT))} ${U}`,hint:'B is at rest, so only A has momentum.'},
  {label:'Momentum of A after (with sign)',kind:'num',answer:mA*vA,unit:U,model:`p_A after = (${cs(mA)})(${cs(vA)}) = ${cs(r2(mA*vA))} ${U}`,hint:vA*uA<0?'A bounced back, so its velocity has the opposite sign to before.':'A still moves the same way, so the sign stays the same.'},

/* 8.3 explosion from rest */
const EXP=[{a:'trolley C',b:'trolley D',ctx:'are held together at rest with a compressed spring between them, then released'},{a:'the skater',b:'her partner',ctx:'stand together at rest on smooth ice and push apart'},{a:'the rifle',b:'the bullet',ctx:'are at rest before the rifle is fired'},{a:'the cannon',b:'the cannonball',ctx:'are at rest before firing'}];
function genExplode(rng){const s=pick(EXP,rng),pos=pick(POS,rng);let mA,mB,vBs;
 if(s.a==='the rifle'){mA=pick([3,3.5,4],rng);mB=pick([.01,.012,.015],rng);vBs=pick([300,350,400],rng);}else if(s.a==='the cannon'){mA=pick([500,800,1000],rng);mB=pick([5,8,10],rng);vBs=pick([100,120,150],rng);}else if(s.a==='the skater'){mA=pick([50,55,60],rng);mB=pick([65,70,80],rng);vBs=pick([1.5,2,2.5],rng);}else{mA=pick(MASSES,rng);mB=pick(MASSES,rng);vBs=pick([1,1.5,2,2.5,3],rng);}
 const bDir=pick(POS,rng),vB=bDir===pos?vBs:-vBs,vA=-mB*vB/mA;
 return {area:'mom-explode',title:'Explosion from rest',prompt:`${s.a[0].toUpperCase()+s.a.slice(1)} (<b>${cs(mA)} kg</b>) and ${s.b} (<b>${cs(mB)} kg</b>) ${s.ctx}. Afterwards ${s.b} moves <b>${bDir}</b> at <b>${cs(vBs)} m·s⁻¹</b>. Ignore friction. Take <b>${pos} as positive</b>. Calculate the velocity of ${s.a}.`,given:'Σp before = Σp after.',
 steps:[
  {label:'Total momentum before',kind:'num',answer:0,unit:U,model:`Everything is at rest, so Σp before = 0 ${U}`,hint:'What is the momentum of objects at rest?'},
  {label:`Momentum of ${s.b} after (with sign)`,kind:'num',answer:mB*vB,unit:U,model:`p = (${cs(mB)})(${cs(vB)}) = ${cs(r2(mB*vB))} ${U}`,hint:'p = mv, with the sign of its direction.'},
  {label:`Velocity of ${s.a}`,kind:'num',answer:vA,unit:V,final:true,model:`0 = (${cs(mA)})v + ${par(r2(mB*vB))} → v = ${cs(r2(vA))} m·s⁻¹, i.e. ${c2(Math.abs(vA))} m·s⁻¹ ${dirWord(vA,pos)}`,hint:'The two momenta must add to zero: equal size, opposite sign.'}]};}

/* 8.4 elastic or inelastic */
function genElastic(rng){const pos='east',mA=pick([1,2,3,4],rng),mB=pick([1,2,3,4,6],rng),uA=pick([2,3,4,5,6],rng);const e=pick([1,1,.5,0],rng);
 const vA=(mA*uA-mB*e*uA)/(mA+mB),vB=(mA*uA+mA*e*uA)/(mA+mB);const vAr=r2(vA),vBr=r2(vB);
 const kb=.5*mA*uA*uA,ka=.5*mA*vAr*vAr+.5*mB*vBr*vBr;const elastic=Math.abs(kb-ka)<0.02*kb;

 return {area:'mom-elastic',title:'Elastic or inelastic?',prompt:`Trolley P (<b>${mA} kg</b>) moves east at <b>${uA} m·s⁻¹</b> and collides with stationary trolley Q (<b>${mB} kg</b>). After the collision P <b>${d(vAr)}</b> and Q <b>${d(vBr)}</b>. Determine, by calculation, whether the collision is elastic or inelastic.`,given:'Ek = ½mv². Kinetic energy is a scalar: no signs.',
 steps:[
  {label:'Total Ek before',kind:'num',answer:kb,unit:'J',model:`Ek before = ½(${mA})(${uA})² + 0 = ${c2(kb)} J`,hint:'Only P moves before the collision.'},

  {label:'Conclusion',kind:'choice',options:['Elastic: Ek before = Ek after','Inelastic: Ek after < Ek before','Elastic, because momentum is conserved'],answer:elastic?0:1,why:[elastic?'':'Compare your two Ek values again.',elastic?'Compare your two Ek values again.':'','Momentum is conserved in BOTH kinds of collision, so it can’t decide. Compare Ek.'],model:elastic?`Ek before = Ek after (${c2(kb)} J), so the collision is elastic.`:`Ek after (${c2(ka)} J) < Ek before (${c2(kb)} J), so the collision is inelastic.`,final:true,hint:'Name the quantity in your conclusion: Ek before vs Ek after.'}]};}

const MOMENTUM_TOPICS={
 mp:{mod:'7-8',name:'Momentum p = mv',tag:'7.1',gen:genP,blurb:'Convert, choose a direction, multiply.'},

<script>

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const cs=x=>{const v=Math.round(x*100)/100;return String(Object.is(v,-0)?0:v).replace('.',',').replace('-','−');};
const f2=x=>{const v=Math.round(x*100)/100;return (Object.is(v,-0)?0:v).toFixed(2).replace('.',',').replace('-','−');};
const kg=m=>String(m).replace('.',',');
const back='';
const STYLE=`<style>

@media (min-width:900px){.xcrash{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}}

/* ---------------- Crash Lab ---------------- */
let C=null,anim=null;
function crashGen(mode){const masses=[.5,1,1.5,2,2.5,3,4];let mA=pick(masses),mB=pick(masses),uA,uB,vA,vB,ask,text;
 if(mode==='stick'){uA=pick([2,3,4,5,6]);uB=pick([0,0,-1,-2,-3,1]);vA=vB=(mA*uA+mB*uB)/(mA+mB);ask='v';

/* ---------------- Fix it: one planted error in a worked answer ---------------- */
const FIXGEN=()=>[M().genP,M().genDeltaP,M().genStop,M().genStick,M().genBounceApart,M().genExplode,M().genElastic];
const PLANTS=[
 {test:q=>q.area==='mom-p',make:q=>{const i=q.steps.findIndex(s=>/Velocity in/.test(s.label));return {i,line:plain(q.steps[i].model).replace(/v = (−?)([\d,]+) m·s⁻¹$/,(m,s,n)=>`v = ${s===''?'−':''}${n} m·s⁻¹`),why:'The sign of the velocity is wrong. Check which way it moves compared with the positive direction.'};}},
 {test:q=>q.area==='mom-p',make:q=>{const i=q.steps.length-1;const g=/mass of <b>(\d+) g/.exec(q.prompt);return g?{i:0,line:`m = ${g[1]} kg`,why:'The mass was never converted: grams must be divided by 1 000 to give kg.'}:null;}},
 {test:q=>q.area==='mom-dp',make:q=>{const i=q.steps.findIndex(s=>s.label==='Δp');return {i,line:plain(q.steps[i].model).replace(/\(([^()]*?) − ([^()]*?)\) = (−?)/,(m,a,b,s)=>`(${b} − ${a.startsWith('−')?'('+a+')':a}) = ${s?'':'−'}`),why:'This is initial minus final. Δp is always final minus initial: m(v − u).'};}},
 {test:q=>q.area==='mom-dp',make:q=>{const i=q.steps.findIndex(s=>/Final velocity/.test(s.label));return {i,line:plain(q.steps[i].model).replace('−',''),why:'After the bounce the ball moves the other way, so its velocity must have the opposite sign to u.'};}},
 {test:q=>q.area==='mom-stick',make:q=>{const i=q.steps.findIndex(s=>s.kind==='choice');return {i,line:'Each trolley keeps its own momentum, so v = u_A.',why:'Only the TOTAL momentum is conserved. After sticking, both masses share one velocity: Σp before = (m_A + m_B)v.'};}},
 {test:q=>q.area==='mom-explode',make:q=>{return {i:0,line:'Σp before = (m_A + m_B)(v_A + v_B)',why:'Everything starts at rest, so the total momentum before is 0.'};}},
 {test:q=>q.area==='mom-elastic',make:q=>{const i=q.steps.length-1;return {i,line:'Momentum is conserved, so the collision is elastic.',why:'Momentum is conserved in BOTH kinds of collision. Decide by comparing Ek before and Ek after.'};}},
 {test:q=>q.area==='mom-stop',make:q=>{const i=q.steps.findIndex(s=>s.kind==='choice');return {i,line:'A longer stopping time makes the change in momentum smaller.',why:'Δp is fixed by the velocities before and after. A longer Δt makes the average FORCE smaller.'};}}];
let F=null;
function fixGen(){for(let k=0;k<20;k++){const q=pick(FIXGEN())(Math.random);const ps=shuffle(PLANTS.filter(p=>p.test(q)));for(const p of ps){const e=p.make(q);if(e&&e.i>=0&&e.line!==q.steps[e.i].model.replace(/<[^>]+>/g,''))return {q,err:e,picked:null};}}return null;}

 const lines=q.steps.map((s,i)=>{const txt=i===err.i?err.line:plain(s.model);const cls=picked===null?'':i===err.i?'rightpick':i===picked?'wrongpick':'';return `<button class="xline ${cls}" data-fline="${i}" ${picked!==null?'disabled':''}><small>${esc(s.label)}</small>${esc(txt)}</button>`;}).join('');

ot imply IEB endorsement. School connections support your current class; the app’s identity and content remain Noel Robert’s.</div>`;}
function canvasResources(){const safe=u=>{try{return new URL(u).protocol==='https:';}catch{return false;}};return (APP_CONFIG.checkpoints||[]).filter(c=>safe(c.url)).map(c=>`<a class="resource" href="${escapeHtml(c.url)}" target="_blank" rel="noopener"><strong>${escapeHtml(c.title)} ↗</strong><span>${escapeHtml(c.detail)}. Check Canvas for current availability and submission instructions.</span></a>`).join('')+(safe(APP_CONFIG.chemistryPage)?`<a class="resource" href="${escapeHtml(APP_CONFIG.chemistryPage)}" target="_blank" rel="noopener"><strong>Chemical calculations in Canvas ↗</strong><span>The class resource page, standalone studio download and written checkpoint.</span></a>`:'')+(safe(APP_CONFIG.chemistryStudio)?`<a class="resource" href="${escapeHtml(APP_CONFIG.chemistryStudio)}" target="_blank" rel="noopener"><strong>Open the full chemistry studio ↗</strong><span>All eight chemistry learning topics, simulations and wider practice. The studio keeps its own browser record; it is not merged with this app.</span></a>`:'')+(safe(APP_CONFIG.momentumStudio)?`<a class="resource" href="${escapeHtml(APP_CONFIG.momentumStudio)}" target="_blank" rel="noopener"><strong>Open Momentum Studio ↗</strong><span>Your existing momentum learning activities.</span></a>`:'')+((APP_CONFIG.checkpoints||[]).length?'<h3 class="spaced">Submit written work</h3><p>In Canvas: <b>Start Assignment → File upload → choose your file → Submit assignment</b>. Wait for the <b>Submitted</b> confirmation. Text entry is an alternative. Selecting a file is not the final submission.</p><p class="small">These are the existing mass-and-moles practice pilots. They do not yet assess every new mixture, purity or limiting-reagent route in this app. Submission records and grade visibility are controlled in Canvas.</p>':'');}
function progress(){const supported=state.records.filter(r=>r.mode==='practice'),checks=state.records.filter(r=>r.mode==='check'),reviews=state.records.filter(r=>r.mode==='review');return heading('Your progress','What can you do on your own now?','Practice with help, checks without help and reviews after a gap are counted separately. Saved on this device only.')+(typeof LADDER!=='undefined'?(()=>{const x=LADDER.summary();return `<div class="xpbar"><div><b>${x.xp}</b> XP · Level ${x.level}</div><div>🔥 ${x.streak}-day streak</div><div>${Object.keys(LADDER.TOPICS).map(k=>`${LADDER.TOPICS[k].name}: ${LADDER.RUNGS[x.rungs[k]||0]}`).join(' · ')}</div></div>`;})():'')+`<div class="stats"><div class="stat"><strong>${supported.length}</strong><span>Supported attempts</span></div><div class="stat"><strong>${checks.length}</strong><span>First check submissions</span></div><div class="stat"><strong>${reviews.length}</strong><span>Reviews after a gap</span></div></div><article class="card"><h2>${isDue(state)?'Your review is due':state.reviewDue?'Your next return':'Plan a return'}</h2><p>${state.reviewDue?'Planned for '+dateText(state.reviewDue)+'. Try a question before looking at the earlier working.':'Submit a check without in-app help to start your review plan.'}</p><label for="review-gap">Gap after your next check</label><select id="review-gap">${[1,3,7].map(d=>`<option value="${d}" ${state.gap===d?'selected':''}>${d} day${d===1?'':'s'}</option>`).join('')}</select><p class="small spaced">Coming back after a few days is what makes it stick. The app reminds you when you open it.</p><button id="start-review">${isDue(state)?'Start my due review':'Try a check now'} →</button></article><div class="section-head"><h2>Your recent attempts</h2><span>Stored on this device</span></div>${state.records.length?`<div class="table-wrap"><table><thead><tr><th>When</th><th>Route</th><th>Support</th><th>Value and unit</th><th>Correction</th></tr></thead><tbody>${state.records.slice(-15).reverse().map(r=>`<tr><td>${dateText(r.at)}</td><td>${AREAS[QUESTIONS.find(q=>q.id===r.id).area]}</td><td>${r.mode==='practice'?'Practice; '+r.hints+' hint(s)'+(r.solution?' + solution':''):r.mode==='review'?'After a gap':'No in-app hints'}${r.repeated?'<br>Repeated question':''}</td><td>${r.correct?'Correct':'Needs correction'}</td><td>${escapeHtml(r.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<p>No attempts recorded yet. Start with the model or try a practice question.</p>'}<div class="row spaced"><button class="secondary" id="export-record">Download my record</button><button class="text" id="clear-record">Clear this device’s record</button></div><div id="reset-confirm" hidden class="notice spaced"><p>This removes the app’s saved attempts on this device. Download a copy first if you need it.</p><button id="confirm-clear">Clear my saved attempts</button><button class="secondary" id="cancel-clear">Keep my record</button></div>`;}
function teacher(){return heading('Owner review · No learner accounts connected','Build around the course','The app belongs to Noel Robert and connects to the current class’s Canvas resources. Its teaching language, sequence and assessment methods come from his course materials.')+`<article class="card"><h2>What this pilot actually does</h2><ul><li>A complete mass-and-moles learning route with a cited coursebook model.</li><li>Ten authored questions across mass and moles, ion mixtures, purity and limiting/excess.</li><li>Staged hints, worked corrections, separate checks and a device-based review plan.</li><li>Complete coursebook and answer-book resources, with the full year mapped.</li><li>Video chapters, captions, transcript and pause-and-write prompts.</li></ul><p><b>This is not a class monitoring dashboard.</b> The progress page contains this browser’s attempts only. There are no pupil accounts, cross-device sync, automatic marking of handwritten work or grade transfers.</p></article><div class="section-head"><h2>Evidence behind the pilot</h2></div><ul><li>SAGS 2025, updated September 2024: quantitative chemistry, 29/41–42. Exact molar-mass wording checked against the source.</li><li>Coursebook Edition 1: year plan p. 7; Module 14 pp. 290–340; worked model p. 294.</li><li>Worked answer book: corresponding printed pages, checked separately from PDF page numbering.</li><li>November route follows the assessment map in this coursebook. Original papers and memos still need a complete question-by-question reconciliation before a whole-course release.</li></ul><h2>Next build decisions</h2><p>Complete the remaining Module 14 teaching routes and assessment mappings. Then validate pupil access, school-independent identity, data storage and the shared teacher view. The core must remain usable if the school platform changes.</p><h2>Portability</h2><p>The current school connections are enabled in one replaceable settings file. The portable sharing edition ships with those settings blank. Source files and authored content can be hosted on another suitable web host. The private review host is for the owner; pupil access has not been configured. No paid service or pupil account has been created.</p><div class="row"><a class="btn secondary" href="#progress">Inspect this device’s record</a><a class="btn secondary" href="#course">Inspect the curriculum map</a></div>`;}
function capture(){if(!questionSession)return;questionSession.answer=document.getElementById('answer-value')?.value??questionSession.answer;questionSession.unit=document.getElementById('answer-unit')?.value??questionSession.unit;questionSession.work=document.getElementById('paper-work')?.checked??questionSession.work;questionSession.note=document.getElementById('error-note')?.value??questionSession.note;}
function feedback(message,ok=false){return `<div class="feedback ${ok?'good':'error'}"><p>${message}</p></div>`;}
function submitAnswer(event){event.preventDefault();capture();const s=questionSession;if(s.submitted)return;const n=parseNumber(s.answer);if(!Number.isFinite(n)||!s.unit||!s.work){s.result=feedback('Enter a numerical value, choose a unit and confirm that you have written your method. You can also choose “I’m stuck” in supported practice.');render(false);return;}
s.attempted=true;const correct=numberCorrect(s.answer,s.q.answer)&&s.unit===s.q.unit;
s.result=correct?feedback('Your final value and unit are correct. Compare the written method as well; a numerical check cannot award method marks.',true):feedback(s.unit!==s.q.unit?'Check the quantity requested and its unit. Your method and the unit must describe the same quantity.':s.q.area==='mass'?'Check the formula count, the requested quantity and which way round you used the relationship.':s.q.area==='mix'?'Check the ion ratio and total solution volume. Add amounts of the required ion, not concentrations.':s.q.area==='purity'?'Use the acid to find pure substance. Divide pure mass by the original sample mass; keep intermediate values unrounded.':'Compare amounts against coefficients. Find the excess that reacts, then subtract it from the initial amount.');
const r={id:s.q.id,mode:s.mode,at:Date.now(),correct,hints:s.hints,solution:s.solution,repeated:s.repeated,answer:s.answer,unit:s.unit,note:''};state.records.push(r);s.recordAt=r.at;if(window.SYNC)SYNC.log({source:'exam',topic:s.q.area,id:s.q.id,rung:s.mode,hints:s.hints,wrong:correct?0:1,xp:0,correct});
if(s.mode!=='practice'){s.submitted=true;s.solution=true;state.reviewDue=Date.now()+state.gap*DAY;}else if(correct)s.solution=true;save();render(false);}
function bind(){document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{selectQuestion(b.dataset.start,'practice');go('practice');});document.querySelectorAll('[data-independent]').forEach(b=>b.onclick=()=>{selectQuestion(b.dataset.independent,'check');go('practice');});
const on=(id,fn,event='click')=>{const el=document.getElementById(id);if(el)el.addEventListener(event,fn);};
on('course-search',e=>{let count=0;document.querySelectorAll('[data-module]').forEach(el=>{el.hidden=!el.dataset.module.includes(e.target.value.trim().toLowerCase());if(!el.hidden)count++;});document.getElementById('no-modules').hidden=count>0;},'input');
on('topic-select',e=>{selectQuestion(e.target.value,questionSession.mode==='review'?'check':questionSession.mode);render(false);},'change');on('mode-select',e=>{selectQuestion(questionSession.q.area,e.target.value);render(false);},'change');on('answer-form',submitAnswer,'submit');
on('stuck',()=>{capture();questionSession.attempted=true;questionSession.result='<p class="feedback">Start with hint 1. Write the next step you can do, then check it.</p>';render(false);});on('next-hint',()=>{capture();if(questionSession.attempted&&questionSession.hints<3){questionSession.hints++;render(false);}});on('show-solution',()=>{capture();if(questionSession.attempted){questionSession.solution=true;render(false);}});on('fresh-question',()=>{selectQuestion(questionSession.q.area,questionSession.mode==='review'?'check':questionSession.mode);render(false);});on('return-support',()=>{selectQuestion(questionSession.q.area,'practice');render(false);});
on('save-note',()=>{capture();const r=state.records.find(r=>r.at===questionSession.recordAt);if(r){r.note=(questionSession.note||'').slice(0,1000);save();document.getElementById('note-status').textContent='Correction note saved on this device.';}else document.getElementById('note-status').textContent='Submit an answer first to attach a correction note to an attempt.';});
on('review-gap',e=>{state.gap=Number(e.target.value);save();},'change');on('start-review',()=>{const last=state.records.findLast(r=>r.mode!=='practice');const area=last?QUESTIONS.find(q=>q.id===last.id).area:'mass';selectQuestion(area,isDue(state)?'review':'check');go('practice');});
on('export-record',()=>{const data={author:'Noel Robert',app:'Grade 10 IEB Science',version:'0.1.0',exported:new Date().toISOString(),scope:'Device-only practice; no school marks or proof of unaided work',...state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='my-science-practice-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});on('clear-record',()=>document.getElementById('reset-confirm').hidden=false);on('cancel-clear',()=>document.getElementById('reset-confirm').hidden=true);on('confirm-clear',()=>{state=cleanState(null);questionSession=null;save();render(false);});
on('definition-check',()=>document.getElementById('definition-feedback').hidden=false);on('mass-slider',e=>{const m=Number(e.target.value);document.getElementById('mass-output').textContent=fmt(m)+' g';document.getElementById('sample-bar').style.height=(m/106*155)+'px';document.getElementById('sample-bar').textContent=fmt(m)+' g';document.getElementById('lab-answer').innerHTML=`n = ${frac(fmt(m),'106')} = ${fmt(m/106)} mol`;},'input');on('molar-check',()=>{const v=document.getElementById('molar-answer').value;document.getElementById('molar-feedback').innerHTML=numberCorrect(v,58.3)?feedback('Correct: 24,3 + 2(16 + 1) = 58,30 g·mol⁻¹. The bracket doubles both O and H.',true):feedback('Count one Mg, two O and two H. Use Mg = 24,3. Then write the sum and recalculate.');});
if(document.getElementById('lesson-video'))bindVideo();else if(document.getElementById('lesson-frame'))bindDriveVideo();}
/* Drive player cannot be seeked or paused from the page, so chapter buttons show the time to skip to and the pause prompt for that part. */function bindDriveVideo(){const prompts=[[21.6,'Write the quantities and units for m, M and n. Check when you resume.'],[53.3,'Write your prediction: is 10 g of MgO more or less than one mole? Why?'],[120,'Complete the substitution for 18 g of MgO before seeing the solution.'],[173.3,'Find the mass of 0,30 mol. Explain why multiplication is appropriate.'],[213.3,'Finish the CO₂ calculation before viewing the answer.']];const buttons=[...document.querySelectorAll('[data-chapter]')];buttons.forEach((b,i)=>b.onclick=()=>{const start=Number(b.dataset.chapter),end=i+1<buttons.length?Number(buttons[i+1].dataset.chapter):Infinity;const time=b.textContent.split(' ')[0];const p=prompts.filter(([t])=>t>=start&&t<end).map(([,x])=>x);document.getElementById('video-prompt').innerHTML=`<p class="feedback"><b>Skip to ${time} in the video.</b> ${p.length?'Pause and write: '+p.join(' Then: '):'Watch the worked example closely and copy the layout.'}</p>`;});const tr=document.getElementById('transcript');if(tr&&window.CHAPTERS)tr.innerHTML=window.CHAPTERS.map(c=>`<p><b>${escapeHtml(c.title)}.</b> ${escapeHtml(c.text)}</p>`).join('');}
async function prepareVideo(){if(readyVideo)return readyVideo;readyVideo=(async()=>{const res=await fetch('../../chemical-calculations/media/lesson-01.mp4');if(!res.ok)throw Error('Video unavailable');const blob=await res.blob();videoUrl=URL.createObjectURL(blob);return videoUrl;})().catch(()=>{readyVideo=null;return null;});return readyVideo;}
async function bindVideo(){const video=document.getElementById('lesson-video');if(videoUrl){video.src=videoUrl;video.addEventListener('loadedmetadata',()=>{video.currentTime=videoTime;},{once:true});}const pauses=[[21.6,'Write the quantities and units for m, M and n. Check when you resume.'],[53.3,'Write your prediction: is 10 g of MgO more or less than one mole? Why?'],[120,'Complete the substitution for 18 g of MgO before seeing the solution.'],[173.3,'Find the mass of 0,30 mol. Explain why multiplication is appropriate.'],[213.3,'Finish the CO₂ calculation before viewing the answer.']];let last=0;video.addEventListener('timeupdate',()=>{const now=video.currentTime;for(let i=0;i<pauses.length;i++){const[t,p]=pauses[i];if(last<t&&now>=t&&now-t<2&&!videoPausedOnce.has(i)){videoPausedOnce.add(i);video.pause();document.getElementById('video-prompt').innerHTML=`<p class="feedback"><b>Pause and write.</b> ${p} Press play when ready.</p>`;break;}}last=now;});
document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=async()=>{b.disabled=true;const desired=Number(b.dataset.chapter);const url=await prepareVideo();if(!video.isConnected)return;const seek=()=>{video.currentTime=desired;last=desired;video.pause();document.getElementById('video-prompt').innerHTML='<p class="small">Chapter ready. Press play when you are ready.</p>';b.disabled=false;};if(url&&video.src!==url){video.src=url;video.addEventListener('loadedmetadata',seek,{once:true});video.load();}else seek();});
try{if(!chapterData.length){if(window.CHAPTERS)chapterData=window.CHAPTERS;else{const res=await fetch('../../chemical-calculations/media/lesson-chapters.json');chapterData=await res.json();}}const t=document.getElementById('transcript');if(t)t.innerHTML=chapterData.map(c=>`<p><b>${escapeHtml(c.title)}.</b> ${escapeHtml(c.text)}</p>`).join('');}catch{const t=document.getElementById('transcript');if(t)t.innerHTML='<a href="../../chemical-calculations/media/lesson-01.vtt">Open the caption transcript</a>';}}
function render(focus=true){const oldVideo=document.getElementById('lesson-video');if(oldVideo){oldVideo.pause();videoTime=oldVideo.currentTime;}const full=location.hash.slice(1)||'today';const route=full.split('/')[0];if(route==='climb')LADDER.enter(full);const routes={today,course,chemistry,learn,practice,resources,progress,teacher,climb:()=>LADDER.render()};main.innerHTML=(routes[route]||today)();document.querySelectorAll('[data-nav]').forEach(a=>{const current=a.dataset.nav===(['learn','chemistry'].includes(route)?'course':route);if(current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});bind();if(route==='climb')LADDER.bind(render);storageNote();if(focus){window.scrollTo(0,0);main.focus({preventScroll:true});}}
window.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a||e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();e.stopImmediatePropagation();const h=a.getAttribute('href').slice(1);if(h==='main'){const m=document.getElementById('main');if(m){if(!m.hasAttribute('tabindex'))m.setAttribute('tabindex','-1');m.focus();}return;}if(location.hash==='#'+h)render();else location.hash=h;},true);window.addEventListener('hashchange',()=>render());window.addEventListener('pagehide',()=>{if(videoUrl)URL.revokeObjectURL(videoUrl);});render(false);
}

</script>
