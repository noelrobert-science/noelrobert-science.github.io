<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr R Science</title>
<meta name="description" content="Watch, train and check: physical sciences by Noel Robert, free for every learner.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@300;400;600&display=swap">
<style>
/* Mr R Science, v2 preview (11 Nov 2026). Phone first: Home with "Next up", picture cards per topic,
   one page per topic with three steps (Watch, Train, Check), progress kept on this device only. */
:root {
  --paper: #ffffff; --soft: #f4f6f9; --soft2: #eceff4; --ink: #151b28; --muted: #5a6475; --line: #dde2ea;
  --accent: #e3121b; --accent-ink: #b80f17; --accent-soft: #fde8e9; --ok: #138a4a; --ok-soft: #e3f5ea;
  --hero: #151b28; --link: #1c64d6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
  --font-display: 'Bricolage Grotesque', 'Lexend', system-ui, sans-serif;
  --font-body: 'Lexend', system-ui, sans-serif; --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1320; --soft: #161e2f; --soft2: #1c2539; --ink: #e9edf4; --muted: #9ba6b9; --line: #283350;
  --accent: #ff4a50; --accent-ink: #ff7a7e; --accent-soft: #3a1619; --ok: #3ccf7c; --ok-soft: #14301f;
  --hero: #232f4d; --link: #85b4ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0d1320; --soft: #161e2f; --soft2: #1c2539; --ink: #e9edf4; --muted: #9ba6b9; --line: #283350;
  --accent: #ff4a50; --accent-ink: #ff7a7e; --accent-soft: #3a1619; --ok: #3ccf7c; --ok-soft: #14301f;
  --hero: #232f4d; --link: #85b4ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 300 16px/1.55 var(--font-body) }
a { color: var(--link) }
button { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* Header */
header { position: sticky; top: 0; z-index: 6; background: var(--paper); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px) }
.bar { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; min-width: 0 }
.brand img { width: 36px; height: 36px; border-radius: 9px; flex: none }
.brand b { font: 800 20px/1 var(--font-display); white-space: nowrap }
.grades { display: flex; align-items: center; gap: 2px; background: var(--soft); border-radius: 99px; padding: 3px; flex: none }
.grades .gl { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 4px 0 8px }
.grades button { font-weight: 600; font-size: 14px; border: 0; background: transparent; border-radius: 99px; padding: 0 8px; min-width: 36px; min-height: 34px; cursor: pointer; color: var(--muted); white-space: nowrap }
.grades button[aria-pressed="true"] { background: var(--ink); color: var(--paper) }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; display: grid; place-items: center; flex: none }
.iconbtn svg { width: 18px; height: 18px }
nav.tabs { display: flex; gap: 4px; max-width: 1000px; margin: 0 auto; padding-bottom: 8px }
nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13px; padding: 7px 4px; border-radius: 12px }
nav.tabs svg { width: 22px; height: 22px }
nav.tabs a[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft) }
@media (max-width: 700px) {
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); z-index: 6 }
  main { padding-bottom: 110px !important }
  .brand b { font-size: 17px }
  .brand img { width: 32px; height: 32px }
  .bar { gap: 8px }
  .iconbtn { width: 36px; height: 36px }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px !important }
  .card .body { padding: 10px 11px 12px }
  .card .body h3 { font-size: 14.5px }
  .cover .ty { font-size: 19px }
  .cover .ty small { font-size: 10.5px }
  .thero > .cover { display: none }
}
@media (max-width: 360px) { .brand b { display: none } }

main { max-width: 1000px; margin: 0 auto; padding-block: 22px 48px; display: grid; gap: 26px }
h1 { font: 800 clamp(28px, 7vw, 40px)/1.05 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
h2 { font: 800 22px/1.15 var(--font-display); margin: 0; text-wrap: balance }
h3 { font-size: 16px; font-weight: 600; margin: 0 }
.lede { color: var(--muted); margin: 8px 0 0; max-width: 60ch }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 6px }
.note { background: var(--soft); border-radius: var(--r); padding: 16px 18px; font-size: 15px; margin: 0 }

/* Next up */
.next { position: relative; overflow: hidden; border-radius: 22px; padding: 20px; background: var(--hero); color: #fff; display: grid; gap: 14px; box-shadow: var(--shadow) }
.next::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%); pointer-events: none }
.next .kicker { color: #ffb3b6 }
.next h2 { font-size: 26px }
.next p { margin: 0; color: rgba(255,255,255,.8) }
.next .acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; position: relative; z-index: 1 }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 99px; border: 0; background: var(--accent); color: #fff; font-weight: 600; font-size: 16px; text-decoration: none; cursor: pointer }
.btn.ghost { background: transparent; color: inherit; border: 1.5px solid currentColor }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 14px }
.next .btn.ghost { color: #fff }

/* Steps strip */
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; counter-reset: s }
.how div { background: var(--soft); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; align-content: start }
.how b { font: 800 18px var(--font-display); display: flex; gap: 8px; align-items: center }
.how b i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 13px/24px var(--font-body); text-align: center; flex: none }
.how span { color: var(--muted); font-size: 14px; line-height: 1.4 }
@media (max-width: 560px) { .how { grid-template-columns: 1fr } .how div { grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline } .how span { grid-column: 2 } }

/* Topic cards */
.mod { display: grid; gap: 12px }
.mod-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.mod-h .num { font: 800 14px var(--font-display); color: #fff; background: var(--mc); border-radius: 8px; padding: 2px 8px }
.mod-h small { color: var(--muted); font-size: 13px }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px }
.card { display: grid; grid-template-rows: auto 1fr; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); min-width: 0 }
.card:hover { border-color: color-mix(in srgb, var(--mc) 60%, var(--line)) }
.cover { position: relative; aspect-ratio: 16 / 9; background: color-mix(in srgb, var(--mc) 12%, var(--paper)); display: grid; place-items: center; overflow: hidden }
.cover img { width: 100%; height: 100%; object-fit: contain; padding: 8px; background: #fff }
.cover .ty { font: 800 clamp(24px, 6vw, 30px)/1.1 var(--font-display); color: var(--mc); text-align: center; padding: 0 14px; letter-spacing: -.01em }
.cover .ty small { display: block; font: 600 12px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px }
.cover .pat { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(color-mix(in srgb, var(--mc) 35%, transparent) 1.2px, transparent 1.3px); background-size: 16px 16px; mask-image: linear-gradient(135deg, #000, transparent 70%); -webkit-mask-image: linear-gradient(135deg, #000, transparent 70%) }
.cover .done-badge { position: absolute; top: 10px; right: 10px; background: var(--ok); color: #fff; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 3px 10px }
.card .body { padding: 12px 14px 14px; display: grid; gap: 8px; align-content: start }
.card .body h3 { font-size: 16.5px; line-height: 1.3 }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }
.tag { font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 99px; padding: 2px 9px; white-space: nowrap }
.dots { display: flex; gap: 6px; align-items: center }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--muted) }
.dot.s1 { border-color: var(--accent); color: var(--accent-ink) }
.dot.s2 { border-color: var(--ok); background: var(--ok); color: #fff }
.dot.na { opacity: .35 }

/* Topic page */
.back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; background: var(--soft); border-radius: 99px; padding: 8px 14px 8px 10px; justify-self: start }
.back svg { width: 18px; height: 18px }
.thero { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: center }
@media (min-width: 760px) { .thero { grid-template-columns: 1.1fr 1fr } }
.thero .cover { border-radius: var(--r); border: 1px solid var(--line) }
.steps { display: grid; gap: 14px }
.step { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; background: var(--paper); box-shadow: var(--shadow) }
.step.is-next { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow) }
.step.is-done { background: color-mix(in srgb, var(--ok-soft) 55%, var(--paper)) }
.step-h { display: flex; gap: 12px; align-items: center }
.step-h .n { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--soft2); font: 800 17px var(--font-display); flex: none }
.step.is-next .n { background: var(--accent); color: #fff }
.step.is-done .n { background: var(--ok); color: #fff }
.step-h div { flex: 1; min-width: 0 }
.step-f { display: flex; justify-content: flex-end }
.step-h small { color: var(--muted); display: block; font-size: 14px; line-height: 1.35 }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px }
.item { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 52px; background: var(--paper); min-width: 0 }
.item:hover { border-color: var(--ink) }
.item svg { width: 20px; height: 20px; flex: none; color: var(--accent) }
.item span { min-width: 0 }
.item b { font-weight: 600; font-size: 15px; display: block }
.item small { color: var(--muted); font-size: 12.5px; display: block }
.item.first { border-color: var(--accent); background: var(--accent-soft) }
.tick { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; min-height: 38px; padding: 0 14px 0 8px; cursor: pointer; font-weight: 600; font-size: 14px; flex: none }
.tick i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 13px; color: transparent }
.tick[aria-pressed="true"] { border-color: var(--ok); color: var(--ok) }
.tick[aria-pressed="true"] i { background: var(--ok); border-color: var(--ok); color: #fff }
.none { color: var(--muted); font-size: 14px; margin: 0 }
.win { display: flex; gap: 14px; align-items: center; background: var(--ok-soft); border-radius: var(--r); padding: 16px 18px }
.win b { font: 800 20px var(--font-display); color: var(--ok) }
.win p { margin: 2px 0 0; font-size: 14.5px }
.win .big { font-size: 34px; line-height: 1 }

/* Lists (Watch / Train / Check / Book) */
.list { display: grid; gap: 10px }
.row { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; border-left: 5px solid var(--mc) }
.row-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap }
.row-h a { color: var(--ink); text-decoration: none; font-weight: 600 }
.row-h a:hover { text-decoration: underline }

footer { max-width: 1000px; margin: 0 auto; padding-block: 0 30px; color: var(--muted); font-size: 13px }
.preview { background: #fff4d6; color: #5b4300; font-size: 13px; text-align: center; padding: 6px 12px }
.preview a { color: inherit; font-weight: 600 }

/* Small celebration */
.pop { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--ok); color: #fff; font-weight: 600; border-radius: 99px; padding: 10px 18px; box-shadow: var(--shadow); z-index: 9; pointer-events: none }
@media (prefers-reduced-motion: no-preference) {
  .card, .item, .step { transition: border-color .15s, box-shadow .15s, background .2s }
  .pop { animation: pop 1.8s ease forwards }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 16px) scale(.9) } 12% { opacity: 1; transform: translate(-50%, 0) scale(1) } 80% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -8px) } }
  .confetti i { position: fixed; top: -10px; width: 8px; height: 14px; border-radius: 2px; z-index: 8; pointer-events: none; animation: fall 1.6s ease-in forwards }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .8 } }
}
</style>
</head>
<body>
<header class="gut">
  <div class="bar">
    <a class="brand" href="#home"><img src="icons/icon.svg" alt=""><b>Mr R Science</b></a>
    <div class="grades" role="group" aria-label="Grade" id="grades"></div>
    <button class="iconbtn" id="theme" type="button" aria-label="Switch dark or light"></button>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="#watch" data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Watch</a>
    <a href="#train" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M6 20v-5h4v5M10 20v-9h4v9M14 20V6h4v14"/></svg>Train</a>
    <a href="#check" data-tab="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Check</a>
    <a href="#book" data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 5v16"/></svg>Book</a>
  </nav>
</header>
<main class="gut" id="main" tabindex="-1"><p class="none">Loading…</p></main>
<footer class="gut"><a href="#about">About Mr R Science</a> · By Noel Robert · Free, no sign-in. Your ticks stay on this phone.</footer>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('mrr-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('mrr-' + k, JSON.stringify(v)); } catch {} } };
let CAT = null, grade = store.get('grade', '10');
let prog = store.get('progress', {});          // { topicId: { watch: 0|1|2, train: …, check: … } } 1 = opened, 2 = done
const STEPS = [
  { k: 'watch', name: 'Watch', verb: 'Watch now', what: 'A short lesson that stops so you can think first.' },
  { k: 'train', name: 'Train', verb: 'Train now', what: 'Practise with fresh numbers. Help only opens after you try.' },
  { k: 'check', name: 'Check', verb: 'Check now', what: 'No help switched on. Did it stick?' }
];
const ICON = {
  watch: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>',
  train: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 20v-5M12 20v-9M18 20V6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
};
// Covers: a real lab diagram where there is one; otherwise the topic's key idea in type.
const COVER = {
  momentum: { t: 'p = mv', s: 'Momentum' }, conservation: { t: 'Σp before = Σp after', s: 'Collisions' },
  'mass-moles': { t: 'n = m ÷ M', s: 'Moles' }, mixtures: { t: 'Na⁺ Cl⁻ Ca²⁺', s: 'Ions in solution' },
  'limiting-purity': { t: 'Which runs out?', s: 'Limiting reagent' }, table4: { t: 'Table 4', s: 'Who is oxidised?' },
  'will-it-react': { t: 'Zn + Cu²⁺ → ?', s: 'Will it react?' }, faraday: { t: 'Q = It', s: 'Counting electrons' },
  guides: { t: '90+', s: 'Revision guides' },
  current: { t: 'I = Q ÷ Δt', s: 'Current' }, meters: { t: 'A in series, V across', s: 'Meters' },
  'series-parallel': { t: 'Series or parallel?', s: 'Resistors' }, combos: { t: 'Total first', s: 'Combinations' },
  explain: { t: 'Brighter or dimmer?', s: 'Reasoning' }, networks: { t: 'Follow the volts', s: 'Networks' },
  'emf-r': { t: 'ε = I(R + r)', s: 'Internal resistance' }, 'with-r': { t: 'Lost volts = Ir', s: 'Solving with r' },
  'graph-r': { t: 'Real meters', s: 'Two readings' },
  review: { t: 'Did it stick?', s: 'Come-back checks' },
  ohm: { t: 'R = V ÷ I', s: "Ohm's law" }, power: { t: 'P = VI', s: 'Power' }, kwh: { t: 'kWh × price', s: 'Paying for electricity' },
  galvanic: { img: 'img/topics/galvanic.jpg' }, 'salt-bridge': { img: 'img/topics/salt-bridge.jpg' }, electrolysis: { img: 'img/topics/electrolysis.jpg' }
};

function gradeData() { return CAT.grades.find(g => g.id === grade) || CAT.grades[0]; }
function allTopics(g) { return (g || gradeData()).modules.flatMap(m => m.topics.map(t => ({ t, m }))); }
// Topic ids can repeat across grades (circuits), so the app keys topics by grade/id.
function findTopic(id) {
  const all = CAT.grades.flatMap(g => g.modules.flatMap(m => m.topics.map(t => ({ t, m, g }))));
  return all.find(x => x.t._k === id) || all.find(x => x.t.id === id && x.g.id === grade) || all.find(x => x.t.id === id) || null;
}
function keyTopics() {
  for (const g of CAT.grades) for (const m of g.modules) for (const t of m.topics) t._k = g.id + '/' + t.id;
  // ticks saved before keys had a grade: move them to the grade that has that topic
  let moved = false;
  for (const k of Object.keys(prog)) if (!k.includes('/')) { const f = findTopic(k); if (f) { prog[f.t._k] = Object.assign({}, prog[k], prog[f.t._k]); } delete prog[k]; moved = true; }
  if (moved) store.set('progress', prog);
  const last = store.get('last', null); if (last && !last.includes('/')) { const f = findTopic(last); store.set('last', f ? f.t._k : null); }
}
function st(tid, k) { return (prog[tid] || {})[k] || 0; }
function has(t, k) { return (t[k] || []).length > 0; }
function nextStep(t) { return STEPS.find(s => has(t, s.k) && st(t._k, s.k) < 2) || null; }
function isDone(t) { return STEPS.every(s => !has(t, s.k) || st(t._k, s.k) === 2) && STEPS.some(s => has(t, s.k)); }
function where(t, m) { return t.page ? `Book p. ${t.page}` : (t.section && /^\d/.test(t.section) ? `Section ${t.section}` : (m.num && /^\d/.test(m.num) ? `Module ${m.num}` : '')); }

function cover(t, m) {
  const c = COVER[t.id] || { t: m.title, s: '' };
  const badge = isDone(t) ? '<span class="done-badge">Done ✓</span>' : '';
  if (c.img) return `<div class="cover"><img src="${esc(c.img)}" alt="" loading="lazy">${badge}</div>`;
  return `<div class="cover"><span class="pat"></span><span class="ty">${esc(c.t)}${c.s ? `<small>${esc(c.s)}</small>` : ''}</span>${badge}</div>`;
}
function dots(t) {
  return `<span class="dots" aria-label="Progress">${STEPS.map(s => {
    const v = st(t._k, s.k), cls = !has(t, s.k) ? 'na' : v === 2 ? 's2' : v === 1 ? 's1' : '';
    return `<span class="dot ${cls}" title="${s.name}${!has(t, s.k) ? ': none yet' : v === 2 ? ': done' : v === 1 ? ': started' : ''}">${v === 2 ? '✓' : s.name[0]}</span>`;
  }).join('')}</span>`;
}
function card(t, m) {
  const w = where(t, m);
  return `<a class="card" href="#t/${esc(t._k)}" style="--mc:${esc(m.colour || '#334155')}">${cover(t, m)}<div class="body"><h3>${esc(t.title)}</h3><div class="meta">${w ? `<span class="tag">${esc(w)}</span>` : '<span></span>'}${dots(t)}</div></div></a>`;
}
function itemLink(it, tid, k, first) {
  const meta = [it.voice, it.note].filter(Boolean).join(' · ');
  return `<a class="item${first ? ' first' : ''}" href="${esc(it.href)}" data-topic="${esc(tid)}" data-step="${k}">${ICON[k]}<span><b>${esc(it.title)}</b>${meta ? `<small>${esc(meta)}</small>` : ''}</span></a>`;
}

function homeView() {
  const g = gradeData(), list = allTopics(g);
  let next = '';
  if (list.length) {
    const last = store.get('last', null), hit = last && list.find(x => x.t._k === last);
    const cand = (hit && !isDone(hit.t)) ? hit : list.find(x => !isDone(x.t) && STEPS.some(s => st(x.t._k, s.k) > 0)) || null;
    if (cand) {
      const s = nextStep(cand.t), it = s && cand.t[s.k][0];
      next = `<section class="next" aria-label="Next up"><div><p class="kicker">Next up</p><h2>${esc(cand.t.title)}</h2></div>
        <p>${s ? `Step ${STEPS.indexOf(s) + 1} of 3: <b>${s.name}</b>. ${esc(s.what)}` : 'All steps done.'}</p>
        <div class="acts">${it ? `<a class="btn" href="${esc(it.href)}" data-topic="${esc(cand.t._k)}" data-step="${s.k}">${ICON[s.k].replace('<svg', '<svg width="18" height="18"')} ${s.verb}</a>` : ''}<a class="btn ghost" href="#t/${esc(cand.t._k)}">See the topic</a></div></section>`;
    } else {
      next = `<section class="next" aria-label="Start here"><div><p class="kicker">Start here</p><h2>Pick a topic you're doing in class.</h2></div>
        <p>Each topic has three steps. Do them in order, and tick each one off when you're done.</p></section>`;
    }
  }
  const how = `<div class="how">${STEPS.map((s, i) => `<div><b><i>${i + 1}</i>${s.name}</b><span>${esc(s.what)}</span></div>`).join('')}</div>`;
  const mods = g.modules.length ? g.modules.map(m => `<section class="mod" style="--mc:${esc(m.colour || '#334155')}"><div class="mod-h"><span class="num">${esc(m.num)}</span><h2>${esc(m.title)}</h2></div><div class="cards">${m.topics.map(t => card(t, m)).join('')}</div></section>`).join('')
    : `<p class="note">${esc(g.coming || 'Coming soon.')}</p>`;
  return `<div><p class="kicker">${esc(g.label)} · ${esc(g.syllabus || 'Physical sciences')}</p><h1>Physical sciences, one topic at a time.</h1></div>${next}${how}${mods}`;
}

function topicView(id) {
  const f = findTopic(id);
  if (!f) return `<a class="back" href="#home">${ICON.back}Home</a><p class="note">That topic isn't here any more.</p>`;
  const { t, m, g } = f;
  if (g.id !== grade) { grade = g.id; store.set('grade', grade); }
  store.set('last', t._k);
  const ns = nextStep(t);
  const steps = STEPS.map((s, i) => {
    const list = t[s.k] || [], v = st(t._k, s.k);
    const cls = !list.length ? '' : v === 2 ? 'is-done' : (ns && ns.k === s.k ? 'is-next' : '');
    const tick = list.length ? `<button class="tick" type="button" data-tick="${esc(t._k)}" data-k="${s.k}" aria-pressed="${v === 2}"><i>✓</i>${v === 2 ? 'Done' : "I've done this"}</button>` : '';
    return `<section class="step ${cls}"><div class="step-h"><span class="n">${v === 2 ? '✓' : i + 1}</span><div><h2>${s.name}</h2><small>${esc(s.what)}</small></div></div>
      ${list.length ? `<div class="items">${list.map((it, j) => itemLink(it, t._k, s.k, j === 0 && cls === 'is-next')).join('')}</div>` : `<p class="none">Nothing here yet for this topic. ${s.k === 'check' ? 'Use the Check tab for a mixed check.' : ''}</p>`}${tick ? `<div class="step-f">${tick}</div>` : ''}</section>`;
  }).join('');
  const win = isDone(t) ? `<div class="win"><span class="big">🎉</span><div><b>Topic done.</b><p>Come back to the Check in a few days to see if it stuck.</p></div></div>` : '';
  const w = where(t, m);
  return `<a class="back" href="#home">${ICON.back}Home</a>
    <div class="thero" style="--mc:${esc(m.colour || '#334155')}"><div><p class="kicker">${esc(m.num)} · ${esc(m.title)}</p><h1>${esc(t.title)}</h1><p class="lede">${esc(m.book)}${t.section && /^\d/.test(t.section) ? ` · Section ${esc(t.section)}` : ''}${t.page ? ` · p. ${esc(t.page)}` : ''}</p><div class="meta" style="margin-top:12px;justify-content:flex-start">${dots(t)}</div></div>${cover(t, m)}</div>
    ${win}<div class="steps">${steps}</div>`;
}

const TABS = {
  watch: { title: 'Watch', lede: 'Short lessons that stop so you think before the answer.' },
  train: { title: 'Train', lede: 'Fresh numbers every time. Help fades as you get better.' },
  check: { title: 'Check', lede: 'No help switched on. Did it stick?' },
  book:  { title: 'Book', lede: 'Where each topic is in your coursebook, so screen and paper stay together.' }
};
function tabView(tab) {
  const g = gradeData(), T = TABS[tab];
  const rows = g.modules.flatMap(m => m.topics.map(t => {
    const w = where(t, m);
    if (tab === 'book') return `<div class="row" style="--mc:${esc(m.colour)}"><div class="row-h"><a href="#t/${esc(t._k)}">${esc(t.title)}</a><span class="tag">${esc(m.num)} · ${esc(t.section || '')}${t.page ? ' · p. ' + esc(t.page) : ''}</span></div></div>`;
    const list = t[tab] || [];
    if (!list.length) return '';
    return `<div class="row" style="--mc:${esc(m.colour)}"><div class="row-h"><a href="#t/${esc(t._k)}">${esc(t.title)} ›</a>${w ? `<span class="tag">${esc(w)}</span>` : ''}</div><div class="items">${list.map(it => itemLink(it, t._k, tab, false)).join('')}</div></div>`;
  })).join('');
  const body = !g.modules.length ? `<p class="note">${esc(g.coming || 'Coming soon.')}</p>` : rows ? `<div class="list">${rows}</div>` : `<p class="note">Nothing here for ${esc(g.label)} yet.</p>`;
  const bookNote = tab === 'book' ? `<p class="note">Use your printed coursebook: the section and page are listed for each topic.</p>` : '';
  return `<div><p class="kicker">${esc(g.label)}</p><h1>${esc(T.title)}</h1><p class="lede">${esc(T.lede)}</p></div>${bookNote}${body}`;
}
function aboutView() {
  return `<a class="back" href="#home">${ICON.back}Home</a><div><h1>About Mr R Science</h1><p class="lede">Physical sciences, the way Noel Robert teaches it: SAGS wording, worked methods that earn the marks, and practice that makes you think before it shows you.</p></div>
  <p class="note"><b>Free and open.</b> Any learner can use it, at any school. There's no sign-in and no account. Your ticks are kept only on this device.</p>
  <p class="note"><b>Teachers.</b> A school can open Mr R Science inside its own signed-in page, so its learners' results reach their teacher. The app itself never collects names or marks.</p>
  <p class="none">© Noel Robert. Past exam questions are used with acknowledgement to their examining body.</p>`;
}

function render() {
  const route = location.hash.slice(1) || 'home';
  const tabKey = route.startsWith('t/') ? 'home' : route;
  document.querySelectorAll('[data-tab]').forEach(a => a.dataset.tab === tabKey ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#grades').innerHTML = '<span class="gl" aria-hidden="true">Gr</span>' + CAT.grades.map(g => `<button type="button" data-g="${esc(g.id)}" aria-pressed="${g.id === grade}" aria-label="${esc(g.label)}">${esc(g.id)}</button>`).join('');
  $('#main').innerHTML = route.startsWith('t/') ? topicView(decodeURIComponent(route.slice(2))) : TABS[route] ? tabView(route) : route === 'about' ? aboutView() : homeView();
  if (route.startsWith('t/')) $('#grades').innerHTML = '<span class="gl" aria-hidden="true">Gr</span>' + CAT.grades.map(g => `<button type="button" data-g="${esc(g.id)}" aria-pressed="${g.id === grade}" aria-label="${esc(g.label)}">${esc(g.id)}</button>`).join('');
}

function celebrate(msg, big) {
  const p = document.createElement('div'); p.className = 'pop'; p.textContent = msg; document.body.appendChild(p); setTimeout(() => p.remove(), 2000);
  if (!big || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#e3121b', '#1c64d6', '#138a4a', '#f59f00', '#7048e8'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('i'); c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length]; c.style.animationDelay = Math.random() * .4 + 's'; c.style.animationDuration = 1.2 + Math.random() * .8 + 's'; box.appendChild(c); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2600);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-g]');
  if (b) { grade = b.dataset.g; store.set('grade', grade); if (location.hash.startsWith('#t/')) location.hash = '#home'; else render(); return; }
  const tk = e.target.closest('[data-tick]');
  if (tk) {
    const tid = tk.dataset.tick, k = tk.dataset.k, f = findTopic(tid);
    prog[tid] = prog[tid] || {}; const was = isDone(f.t);
    prog[tid][k] = prog[tid][k] === 2 ? 1 : 2; store.set('progress', prog); render();
    if (prog[tid][k] === 2) { const done = isDone(f.t); celebrate(done && !was ? 'Topic done! 🎉' : `${STEPS.find(s => s.k === k).name} done ✓`, done && !was); }
    return;
  }
  const it = e.target.closest('a[data-step]');
  if (it) {
    const tid = it.dataset.topic, k = it.dataset.step;
    prog[tid] = prog[tid] || {}; if (!prog[tid][k]) prog[tid][k] = 1; store.set('progress', prog); store.set('last', tid);
    try { sessionStorage.setItem('mrr-return', location.pathname + '#t/' + tid); sessionStorage.setItem('mrr-return-title', findTopic(tid).t.title); } catch {}
  }
});
function setTheme(v) {
  if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
  const dark = v ? v === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#theme').innerHTML = dark ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
                               : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>';
  $('#theme').setAttribute('aria-label', dark ? 'Switch to light' : 'Switch to dark');
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0d1320' : '#ffffff';
}
setTheme(store.get('theme', null));
$('#theme').addEventListener('click', () => { const dark = document.documentElement.getAttribute('data-theme') ? document.documentElement.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; const v = dark ? 'light' : 'dark'; store.set('theme', v); setTheme(v); });
try { sessionStorage.removeItem('mrr-return'); } catch {}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
fetch('catalog.json').then(r => r.json()).then(c => { CAT = c; keyTopics(); if (!CAT.grades.some(g => g.id === grade)) grade = CAT.grades[0].id; render(); })
  .catch(() => { $('#main').innerHTML = '<p class="note">The lesson list could not load. Check your connection, then reopen the app.</p>'; });
</script>
</body>
</html>
