<canvas id="out" width="1920" height="1080"></canvas>
<script src="lib/mp4-muxer.js"></script>
<script>
/* AI literacy, v3 (new script from the updated editions, same look and sound as v2): an editorial motion graphic drawn in code.
   Every frame is a pure function of time, so stills, previews and the final film all come from one source.
   Claims and sources: ../CLAIMS.md (unchanged from v1). Audio: synthesised in code below, no samples. */
const W = 1920, H = 1080, FPS = 30, SUB = 6, SHUTTER = 0.5;
const INK = '#0d0e11', PAPER = '#efece4', RED = '#e3121b', GREY = '#8b9099';
const M = 120, GUT = 24, CW = (W - 2 * M - 11 * GUT) / 12;
const col = (i) => M + i * (CW + GUT);

/* ---------- easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  expoOut: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  expoIn: (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10)),
  expoInOut: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2),
  quartOut: (x) => 1 - Math.pow(1 - x, 4),
  quartInOut: (x) => (x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2),
};
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* ---------- type ---------- */
const F = {
  g: (w, s) => `${w} ${s}px SG`,
  serif: (s) => `italic 400 ${s}px NR`,
  serifUp: (s) => `500 ${s}px NR`,
  mono: (s) => `500 ${s}px JB`,
};
function setType(ctx, font, size, track) { ctx.font = font; ctx.letterSpacing = (track === undefined ? -0.03 * size : track) + 'px'; }
/* A line that rises into a mask on the way in and lifts out of it on the way out. */
function T(ctx, o) {
  const { s, x, y, size, font, color, tin, tout = 1e9, din = 0.75, dout = 0.5, align = 'left', track } = o;
  const t = o.t;
  if (t < tin || t > tout + dout) return 0;
  setType(ctx, font, size, track);
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  const w = ctx.measureText(s).width;
  const pIn = E.expoOut(prog(t, tin, tin + din)), pOut = E.expoIn(prog(t, tout, tout + dout));
  const dy = (1 - pIn) * size * 1.15 - pOut * size * 1.15;
  const x0 = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 40, y - size * 1.02, w + 80, size * 1.32); ctx.clip();
  ctx.fillStyle = color; ctx.fillText(s, x, y + dy); ctx.restore();
  return w;
}
/* Typewriter: characters appear one by one with a caret. */
function typed(ctx, s, x, y, size, font, color, t, t0, cps = 26, caret = true, track) {
  if (t < t0) return 0;
  const n = Math.min(s.length, Math.floor((t - t0) * cps));
  setType(ctx, font, size, track); ctx.textAlign = 'left'; ctx.fillStyle = color;
  const part = s.slice(0, n); ctx.fillText(part, x, y);
  const w = ctx.measureText(part).width;
  if (caret && (n < s.length || Math.floor(t * 2.4) % 2 === 0)) { ctx.fillStyle = RED; ctx.fillRect(x + w + 6, y - size * 0.78, Math.max(3, size * 0.06), size * 0.92); }
  return w;
}
function hair(ctx, x1, y, x2, color, p, lw = 2) { if (p <= 0) return; ctx.fillStyle = color; ctx.fillRect(x1, y - lw / 2, (x2 - x1) * p, lw); }

/* ---------- scenes ---------- */
/* ===== v4: one idea at a time, held long enough to read =====
   Pacing: each card lands, then holds for max(3 s, words ÷ 3 + 1.5 s) (+2 s when a number counts up),
   then lifts out. Chapters change with a 0.8 s wipe and a short breath of quiet.
   Every line and page: ../CLAIMS.md. CUT: 'talk' (about 2:00) or 'extended' (later). */
const COVERS = {};
const CUT = new URLSearchParams(location.search).get('cut') || 'talk';
const IN = 1.0, OUT = 0.55, WIPE = 0.6, BREATH = 0.3;

/* helpers: a stack of lines, each rising into its mask, lifting out together at the card's end */
function L(ctx, c, t, s, x, y, size, kind, color, delay = 0, align = 'left') {
  const font = kind === 's' ? F.serif(size) : kind === 'm' ? F.mono(size) : F.g(kind === 'g5' ? 500 : kind === 'g4' ? 400 : 700, size);
  const track = kind === 's' ? -size * 0.018 : kind === 'm' ? size * 0.14 : undefined;
  return T(ctx, { t, s, x, y, size, font, color, tin: c.a + delay, tout: c.end, din: 0.9, dout: OUT - 0.05, align, track });
}
function fadeIn(t, c, d = 0, len = 0.6) { return E.quartOut(prog(t, c.a + d, c.a + d + len)) * (1 - E.quartInOut(prog(t, c.end, c.end + OUT))); }
function count(t, c, d, n) { return Math.round(n * E.quartOut(prog(t, c.a + d, c.a + d + 1.6))); }

/* ---------- the cards ---------- */
const CARDS = [
  // 1 · Start here
  { ch: 'Start here', bg: INK, cap: 'Stop using it like Google.', inT: 3.2, src: 'Co-Pilot, Not Autopilot · p. 2 · chat shown as an illustration',

      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 60 - 44 * m); ctx.stroke();
      ctx.globalAlpha = a * (1 - m);
      ctx.beginPath(); ctx.arc(bx + 70, by + 58, 18, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(bx + 83, by + 71); ctx.lineTo(bx + 98, by + 86); ctx.stroke();
      typed(ctx, 'what is momentum', bx + 130, by + 78, 46, F.g(400, 46), fg, t, c.a + 0.3, 14, u < 1.5, 0);
      ctx.globalAlpha = a * E.quartOut(prog(u, 2.3, 2.8));
      setType(ctx, F.mono(20), 20, 3); ctx.fillStyle = GREY; ctx.fillText('YOU', bx + 50, by + 70);
      setType(ctx, F.g(400, 40), 40, 0); ctx.fillStyle = fg; ctx.fillText('My attempt: p = mv, so p = 2 × 3 = 6. Units?', bx + 50, by + 120);
      ctx.globalAlpha = a * E.quartOut(prog(u, 2.8, 3.3));
      setType(ctx, F.mono(20), 20, 3); ctx.fillStyle = RED; ctx.fillText('AI · ONE HINT', bx + 50, by + 210);
      setType(ctx, F.serif(44), 44, -0.5); ctx.fillStyle = fg; ctx.fillText('Good start. What are the units of mass and of velocity?', bx + 50, by + 262);
      ctx.globalAlpha = 1;
      L(ctx, c, t, 'Stop using it', col(0), 800, 130, 'g', fg, 3.0);
      setType(ctx, F.g(700, 130), 130); const w = ctx.measureText('Stop using it ').width;
      L(ctx, c, t, 'like Google.', col(0) + w, 800, 134, 's', RED, 3.2);
    } },

      L(ctx, c, t, `${count(t, c, 0.8, 64)}%`, col(0) - 6, 590, 170, 'g', PAPER, 0.8);
      L(ctx, c, t, 'of US teens use AI chatbots', col(4), 560, 52, 'g5', PAPER, 1.0);
      L(ctx, c, t, `${count(t, c, 1.4, 47)}%`, col(0) - 6, 800, 170, 'g', RED, 1.4);
      L(ctx, c, t, 'of student chats Anthropic analysed', col(4), 750, 52, 'g5', PAPER, 1.6);
      L(ctx, c, t, 'asked directly for an answer or finished work', col(4), 815, 52, 's', PAPER, 1.8);
      L(ctx, c, t, 'USA FIGURES · SELF-REPORTED', col(4), 600, 22, 'm', GREY, 1.2);
    } },
  // 2 · The evidence
  { ch: 'The evidence', bg: PAPER, cap: 'Nearly 1 000 pupils. Practice with AI: +48% and +127%. Exam, AI off: −17%. Practice soared. Learning sank.', inT: 4.6, count: true,
    src: 'Bastani et al. 2025, PNAS · Co-Pilot, Not Autopilot · p. 7 · Brain On, AI On · p. 8',
    draw(ctx, c, t) {

      L(ctx, c, t, 'Maths practice with AI.', col(0) + w, 230, 90, 's', INK, 0.4);
      panel(ctx, c, t, col(0), col(5) + CW - 20, 'DURING PRACTICE · AI ON', [['No AI', 0, 'baseline'], ['Open chatbot', 48], ['Hint-only tutor', 127]], 0.9);
      panel(ctx, c, t, col(6) + 20, col(11) + CW, 'THE EXAM · AI SWITCHED OFF', [['No AI', 0, 'baseline'], ['Open chatbot', -17, null, true], ['Hint-only tutor', 0, 'no clear drop']], 2.4);
      L(ctx, c, t, 'Practice soared.', col(0), 800, 100, 'g', INK, 3.9);

    src: 'Co-Pilot, Not Autopilot · p. 8 · Kestin et al. 2025, Scientific Reports',

      ctx.globalAlpha = a; setType(ctx, F.mono(22), 22, 2); ctx.fillStyle = GREY;
      ctx.fillText('ACTIVE-LEARNING CLASS', col(8), 470); ctx.fillText('AI TUTOR', col(8), 560);
      ctx.fillStyle = 'rgba(13,14,17,.55)'; ctx.fillRect(col(8), 485, 170 * p, 26);
      ctx.fillStyle = RED; ctx.fillRect(col(8), 575, 400 * p, 26);

      ctx.globalAlpha = 1;

    } },
  // 3 · Why it goes wrong
  { ch: 'Why it goes wrong', bg: INK, cap: 'Asked “Are you sure?”, one model wrongly admitted a “mistake” in up to 98% of challenged answers.', inT: 2.0, count: true, glitch: 1.8,
    src: 'Co-Pilot, Not Autopilot · p. 6',
    draw(ctx, c, t) {
      L(ctx, c, t, 'SYCOPHANCY · PEOPLE-PLEASING', col(0), 240, 26, 'm', RED, 0);
      L(ctx, c, t, 'Asked “Are you sure?”,', col(0), 370, 88, 'g', PAPER, 0.1);
      L(ctx, c, t, 'one model wrongly admitted a “mistake”', col(0), 470, 76, 's', PAPER, 0.4);
      L(ctx, c, t, 'in up to', col(0), 570, 44, 'g5', GREY, 0.8);
      L(ctx, c, t, `${count(t, c, 0.9, 98)}%`, col(0) - 8, 800, 250, 'g', RED, 0.9);
      L(ctx, c, t, 'of challenged answers.', col(6), 780, 60, 'g5', PAPER, 1.2);
    } },
  { ch: 'Why it goes wrong', bg: INK, extendedOnly: true, count: true, inT: 2.2, glitch: 1.9,
    cap: 'Most AI tests give marks for a lucky guess, but none for “I don’t know”. An older model was wrong 75% of the time. A newer one skipped half the questions: wrong 26%.',
    src: 'Co-Pilot, Not Autopilot · p. 6 · OpenAI 2025',
    draw(ctx, c, t) {
      L(ctx, c, t, 'HALLUCINATION · MADE-UP FACTS', col(0), 240, 26, 'm', RED, 0);
      L(ctx, c, t, 'Tests reward a lucky guess,', col(0), 370, 90, 'g', PAPER, 0.1);

      [['An older model', 75, 'wrong'], ['A newer one, which skipped half the questions', 26, 'wrong']].forEach(([lab, v, w], i) => {
        const y = 620 + i * 120, d = 1.0 + i * 0.5, p = E.quartOut(prog(t - c.a, d, d + 1.4)), a = fadeIn(t, c, d - 0.1);
        ctx.globalAlpha = a; setType(ctx, F.g(500, 40), 40, -0.3); ctx.fillStyle = PAPER; ctx.fillText(lab, col(0), y);
        ctx.fillStyle = i ? 'rgba(239,236,228,.6)' : RED; ctx.fillRect(col(0), y + 18, 900 * (v / 100) * p, 26);
        setType(ctx, F.mono(40), 40, 0); ctx.fillStyle = i ? PAPER : RED; ctx.fillText(`${w} ${Math.round(v * p)}% of the time`, col(0) + 900 * (v / 100) * p + 24, y + 42);
      });

  { ch: 'Why it goes wrong', bg: INK, cap: 'A legal team cited nine cases. Only two could be traced. The court: “irresponsible and downright unprofessional”.', inT: 2.2, glitch: 1.6,
    src: 'Co-Pilot, Not Autopilot · p. 6 · Pietermaritzburg High Court, Jan 2025',
    draw(ctx, c, t) {
      L(ctx, c, t, 'THE REAL-WORLD COST · PIETERMARITZBURG HIGH COURT · JAN 2025', col(0), 240, 26, 'm', RED, 0);
      L(ctx, c, t, 'A legal team cited nine cases.', col(0), 370, 88, 'g', PAPER, 0.1);
      L(ctx, c, t, 'Only two could be traced.', col(0), 470, 90, 's', RED, 0.5);
      const u = t - c.a;
      for (let i = 0; i < 9; i++) {
        const p = fadeIn(t, c, 0.7 + i * 0.06, 0.4), x = col(0) + i * 124, y = 540, real = i < 2;
        ctx.globalAlpha = p * (real || u < 1.6 ? 1 : 0.35); ctx.strokeStyle = PAPER; ctx.lineWidth = 2; ctx.strokeRect(x, y, 86, 110);
        if (real) { ctx.fillStyle = PAPER; ctx.fillRect(x + 14, y + 22, 58, 6); ctx.fillRect(x + 14, y + 40, 42, 6); ctx.fillRect(x + 14, y + 58, 52, 6); }
        if (!real && u > 1.6) { ctx.strokeStyle = RED; ctx.beginPath(); ctx.moveTo(x - 6, y + 116); ctx.lineTo(x + 92, y - 6); ctx.stroke(); }
      }
      ctx.globalAlpha = 1;
      L(ctx, c, t, '“irresponsible and downright unprofessional”', col(0), 760, 66, 's', PAPER, 1.9);
      L(ctx, c, t, 'THE COURT, ON CITATIONS THAT LIKELY CAME FROM AI', col(0), 815, 22, 'm', GREY, 2.1);

  { ch: 'Why it goes wrong', bg: INK, cap: 'Asked to explain 36 + 59, it described “carry the one”. That is not what it actually did.', inT: 2.4, glitch: 2.0,
    src: 'Co-Pilot, Not Autopilot · p. 5 · Anthropic 2025',
    draw(ctx, c, t) {

      L(ctx, c, t, '36 + 59', col(0) - 6, 500, 240, 'g', PAPER, 0.1);
      const p = E.quartInOut(prog(t - c.a, 0.5, 1.4)), a = fadeIn(t, c, 0.4);

      [360, 450].forEach((y) => { ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + (ex - sx) * p, y + (405 - y) * p * p); ctx.stroke(); });

      ctx.globalAlpha = fadeIn(t, c, 1.3); setType(ctx, F.g(700, 96), 96); ctx.fillStyle = PAPER; ctx.fillText('95', ex + 30, 440); ctx.globalAlpha = 1;
      L(ctx, c, t, 'Asked to explain, it described “carry the one”.', col(0), 680, 68, 's', PAPER, 1.5);

      L(ctx, c, t, 'of thought.', col(0), 570, 146, 's', RED, 0.4);
      L(ctx, c, t, 'If the AI does the thinking, it is the AI’s “memory”', col(0), 740, 54, 'g5', INK, 1.0);
      L(ctx, c, t, 'that gets the practice, not yours.', col(0), 808, 54, 'g5', INK, 1.2);

  // 4 · The fix
  { ch: 'The fix', bg: PAPER, cap: 'Augment your thinking: explain, question, give feedback. Don’t automate it: write, solve, summarise for you.', inT: 2.2,
    src: 'Co-Pilot, Not Autopilot · p. 8',

      hair(ctx, col(0) - 6, 602, col(0) + aw + 6, RED, E.quartInOut(prog(t - c.a, 1.6, 2.1)) * (1 - E.quartInOut(prog(t, c.end, c.end + OUT))), 6);
      L(ctx, c, t, 'write · solve · summarise for you', col(0), 720, 42, 'g4', GREY, 1.2);

  { ch: 'The fix', bg: PAPER, cap: 'Attempt it first. Name the blockage. Ask for ONE hint. Check it. Close the AI, go again.', inT: 3.0,
    src: 'Co-Pilot, Not Autopilot · pp. 12, 29 · Brain On, AI On · p. 12',
    draw(ctx, c, t) {
      L(ctx, c, t, 'The attempt-first routine', col(0), 300, 96, 'g', INK, 0.1);
      L(ctx, c, t, 'One routine for every subject.', col(0), 380, 46, 's', GREY, 0.4);
      const x0 = col(0) + 170, x1 = col(11) + CW - 170, y = 590, a = fadeIn(t, c, 0.6);
      ctx.globalAlpha = a; hair(ctx, x0, y, x1, 'rgba(13,14,17,.25)', E.quartInOut(prog(t - c.a, 0.6, 3.1)), 2);
      ['Attempt it first', 'Name the blockage', 'Ask for ONE hint', 'Check it', 'Close the AI, go again'].forEach((s, i) => {
        const d = 0.7 + i * 0.55, x = x0 + (x1 - x0) * (i / 4), p = E.quartOut(prog(t - c.a, d, d + 0.5));

        ctx.globalAlpha = a * p; ctx.fillStyle = i === 4 ? RED : INK; ctx.beginPath(); ctx.arc(x, y, 28, 0, Math.PI * 2); ctx.fill();

        setType(ctx, F.g(500, 40), 40, -0.3); ctx.fillStyle = INK;
        const words = s.split(' '); let line = '', ly = y + 96;
        words.forEach((wd) => { const tl = line ? line + ' ' + wd : wd; if (ctx.measureText(tl).width > 300) { ctx.fillText(line, x, ly); line = wd; ly += 48; } else line = tl; });

  { ch: 'The fix', bg: PAPER, cap: 'The hint ladder: climb only as high as you need. The full solution is the last resort.', inT: 2.2,
    src: 'Co-Pilot, Not Autopilot · p. 12',
    draw(ctx, c, t) {
      L(ctx, c, t, 'The hint ladder', col(0), 300, 96, 'g', INK, 0.1);
      L(ctx, c, t, 'Climb only as high as you need.', col(0), 380, 46, 's', GREY, 0.4);
      L(ctx, c, t, 'The full solution', col(0), 640, 56, 's', RED, 2.0);
      L(ctx, c, t, 'is the last resort.', col(0), 705, 56, 's', RED, 2.2);
      const R = [['Which principle applies?', 'SMALLEST HELP'], ['What should my first step be?', 'A NUDGE'], ['Where is my first error?', 'YOU STILL FIX IT'], ['Show a similar worked example', 'THEN REDO YOURS'], ['Show the full solution', 'LAST RESORT ONLY']];
      const lx = col(6), lw = col(11) + CW - col(6);
      R.forEach(([q, tag], i) => {

    s.connect(bp); bp.connect(g); g.connect(master); s.start(SIL_A - 3); s.stop(SIL_A + 0.01);
    const o = ac.createOscillator(), og = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(110, SIL_A - 3); o.frequency.exponentialRampToValueAtTime(880, SIL_A - 0.02);
    og.gain.setValueAtTime(0, SIL_A - 3); og.gain.linearRampToValueAtTime(0.06, SIL_A - 0.04); og.gain.linearRampToValueAtTime(0, SIL_A); o.connect(og); og.connect(master); o.start(SIL_A - 3); o.stop(SIL_A + 0.01); }
  // end card: one low hit and a soft bell, then a gentle fade
  { const t = SIL_B;
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(41, t + 0.4);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.7, t + 0.008); g.gain.exponentialRampToValueAtTime(0.001, t + 1.6); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.7);
    for (const [f, l] of [[440, 0.05], [659.25, 0.035], [880, 0.025], [1318.5, 0.012]]) {
      const b = ac.createOscillator(), bg = ac.createGain(); b.frequency.value = f; bg.gain.setValueAtTime(0, t); bg.gain.linearRampToValueAtTime(l, t + 0.01);
      bg.gain.exponentialRampToValueAtTime(0.0005, DUR - 0.1); b.connect(bg); bg.connect(master); b.start(t); b.stop(DUR);
    }
    for (const f of [110, 164.81, 261.63]) { const p = ac.createOscillator(), pg = ac.createGain(); p.type = 'sawtooth'; p.frequency.value = f; pg.gain.setValueAtTime(0, t); pg.gain.linearRampToValueAtTime(0.01, t + 0.4); pg.gain.linearRampToValueAtTime(0, DUR - 0.1); p.connect(pg); pg.connect(padOut); p.start(t); p.stop(DUR); }
  }
  master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(1, 0.05); master.gain.setValueAtTime(1, DUR - 1.2); master.gain.linearRampToValueAtTime(0, DUR - 0.05);
  const buf = await ac.startRendering();
  // loudness: K-weighted, gated (BS.1770 style), normalised to -16 LUFS, peaks held under -1 dBFS
  const kac = new OfflineAudioContext(2, buf.length, SR), src = kac.createBufferSource(); src.buffer = buf;
  const sh = kac.createBiquadFilter(); sh.type = 'highshelf'; sh.frequency.value = 1681; sh.gain.value = 4;
  const hp = kac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 38; hp.Q.value = 0.5;
  src.connect(sh); sh.connect(hp); hp.connect(kac.destination); src.start();
  const kb = await kac.startRendering();
  const L = kb.getChannelData(0), Rr = kb.getChannelData(1), blk = 0.4 * SR, hop = 0.1 * SR, ms = [];
  for (let s = 0; s + blk <= L.length; s += hop) { let a = 0; for (let i = s; i < s + blk; i++) a += L[i] * L[i] + Rr[i] * Rr[i]; ms.push(a / blk); }
  const lufs = (m) => -0.691 + 10 * Math.log10(m);
  let g1 = ms.filter((m) => lufs(m) > -70); const rel = lufs(g1.reduce((a, b) => a + b, 0) / g1.length) - 10;
  const g2 = g1.filter((m) => lufs(m) > rel); const integrated = lufs(g2.reduce((a, b) => a + b, 0) / g2.length);
  const gain = Math.pow(10, (-16 - integrated) / 20), ceil = Math.pow(10, -1 / 20);
  const outB = [buf.getChannelData(0), buf.getChannelData(1)].map((ch) => { const o = new Float32Array(ch.length); for (let i = 0; i < ch.length; i++) { let v = ch[i] * gain; const a = Math.abs(v); if (a > ceil * 0.8) v = Math.sign(v) * (ceil * 0.8 + (ceil * 0.2) * Math.tanh((a - ceil * 0.8) / (ceil * 0.2))); o[i] = v; } return o; });
  let peak = 0; outB.forEach((c) => c.forEach((v) => { if (Math.abs(v) > peak) peak = Math.abs(v); }));
  window.__audioInfo = { integratedBefore: integrated.toFixed(2), gainDb: (20 * Math.log10(gain)).toFixed(2), peakDb: (20 * Math.log10(peak)).toFixed(2) };
  return outB;
}

/* ---------- export: H.264 + AAC in MP4, all in the browser ---------- */
async function exportFilm(opts = {}) {
  const fps = opts.fps || FPS, bitrate = opts.bitrate || 1_400_000, frames = Math.round((opts.dur || DUR) * fps);
  const chans = await renderAudio();
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), fastStart: 'in-memory',
    video: { codec: 'avc', width: W, height: H, frameRate: fps }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR } });
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => { window.__err = String(e); } });
  ve.configure({ codec: 'avc1.640032', width: W, height: H, bitrate, framerate: fps, bitrateMode: opts.mode || 'variable', avc: { format: 'avc' } });
  const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => { window.__err = String(e); } });
  ae.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 160000 });
  const N = chans[0].length;
  for (let s = 0; s < N; s += 4800) {
    const n = Math.min(4800, N - s), data = new Float32Array(n * 2); data.set(chans[0].subarray(s, s + n), 0); data.set(chans[1].subarray(s, s + n), n);
    ae.encode(new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(s / SR * 1e6), data }));
  }
  const out = document.getElementById('out').getContext('2d');
  for (let f = 0; f < frames; f++) {
    const c = frame(f * (FPS / fps), null, opts.sub || SUB);
    if (f % 30 === 0) out.drawImage(c, 0, 0);
    const vf = new VideoFrame(c, { timestamp: Math.round(f / fps * 1e6), duration: Math.round(1e6 / fps) });
    ve.encode(vf, { keyFrame: f % (fps * 2) === 0 }); vf.close();
    while (ve.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 2));
    window.__progress = f / frames;
  }
  await ve.flush(); await ae.flush(); muxer.finalize();
  window.__mp4 = new Uint8Array(muxer.target.buffer);
  return window.__mp4.length;
}
window.getChunk = (i, size) => { let s = ''; const a = window.__mp4.subarray(i, i + size); for (let k = 0; k < a.length; k += 0x8000) s += String.fromCharCode.apply(null, a.subarray(k, k + 0x8000)); return btoa(s); };

/* ---------- boot ---------- */
async function boot() {
  const fonts = [['SG', 'lib/space-grotesk-latin-400-normal.woff2', '400', 'normal'], ['SG', 'lib/space-grotesk-latin-500-normal.woff2', '500', 'normal'], ['SG', 'lib/space-grotesk-latin-700-normal.woff2', '700', 'normal'],
    ['NR', 'lib/newsreader-latin-400-italic.woff2', '400', 'italic'], ['NR', 'lib/newsreader-latin-500-normal.woff2', '500', 'normal'], ['JB', 'lib/jetbrains-mono-latin-500-normal.woff2', '500', 'normal']];
  await Promise.all(fonts.map(([fam, url, weight, style]) => new FontFace(fam, `url(${url})`, { weight, style }).load().then((f) => document.fonts.add(f))));
  await Promise.all(['junior', 'senior'].map((k) => new Promise((r) => { const im = new Image(); im.onload = () => { COVERS[k] = im; r(); }; im.onerror = r; im.src = `../../demo/booklets/${k}-cover.jpg`; })));
  window.__ready = true;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) frame(Math.round(+q.get('t') * FPS), document.getElementById('out').getContext('2d'));
}
window.still = (t) => frame(Math.round(t * FPS), document.getElementById('out').getContext('2d'));
boot();
