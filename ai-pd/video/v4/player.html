<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI literacy</title>
<style>html,body{margin:0;height:100%;background:#0d0e11;display:flex;align-items:center;justify-content:center}video{max-width:100%;max-height:100%}</style></head>
<body><video id="v" controls playsinline preload="metadata" poster="ai-literacy-poster-v4.jpg" src="ai-literacy-v4.mp4"></video>
<script src="../../js/ail-cues.js"></script>
<script>/* Captions and chapters added in code, because browsers block .vtt files opened from a folder (the same cues are in the .vtt files here).
   Captions start hidden, because the text is already on screen: the CC button shows them. Space plays or pauses. */
const v = document.getElementById('v');
try { const tr = v.addTextTrack('captions', 'English', 'en'); (window.AIL_CUES || []).forEach(([a, z, s]) => { const c = new VTTCue(a, z, s); c.line = -3; tr.addCue(c); }); tr.mode = 'hidden'; } catch (e) {}
try { const ch = v.addTextTrack('chapters', 'Chapters', 'en'); (window.AIL_CHAPTERS || []).forEach(([a, z, s], i) => ch.addCue(new VTTCue(a, z, (i + 1) + ' · ' + s))); ch.mode = 'hidden'; } catch (e) {}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && parent !== window) parent.postMessage('ai-pd:close-view', '*');
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); v.paused ? v.play() : v.pause(); }
});</script>
</body></html>
