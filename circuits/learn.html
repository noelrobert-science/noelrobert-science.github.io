<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch · Circuits · Mr R Science</title>
<meta name="description" content="Step-through circuits lessons from Mr R's coursebook: the worked examples a line at a time, with stops for you to answer.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b7285'/%3E%3Cpath d='M7 16h5l2-5 4 10 2-5h5' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Circuits "Watch": one screen at a time, one Next button. Fonts are hosted on this site (no outside requests). */
@font-face { font-family: 'Lexend'; font-weight: 300 500; src: url(../assets/fonts/Lexend-400.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Lexend'; font-weight: 600 800; src: url(../assets/fonts/Lexend-600.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Outfit'; font-weight: 800; src: url(../assets/fonts/Outfit-800.woff2) format('woff2'); font-display: swap; }
/* the book's figures name these families */
@font-face { font-family: 'Body'; font-weight: 300 500; src: url(../assets/fonts/Lexend-400.woff2) format('woff2'); }
@font-face { font-family: 'Body'; font-weight: 600 800; src: url(../assets/fonts/Lexend-600.woff2) format('woff2'); }
@font-face { font-family: 'Display'; src: url(../assets/fonts/Outfit-800.woff2) format('woff2'); }
:root {
  --paper: #ffffff; --soft: #f3f6f8; --soft2: #e8eef1; --ink: #17242f; --muted: #556673; --line: #d6e0e5;
  --acc: #0b7285; --acc-ink: #08596a; --acc-soft: #e3f3f6; --ok: #0f7a43; --ok-soft: #e6f5ec; --no: #a3360f; --no-soft: #fff1e8;
  --hero: #12303a; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
  --font: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif; --display: 'Outfit', 'Lexend', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1720; --soft: #15222d; --soft2: #1b2b38; --ink: #e8eef3; --muted: #9db0bd; --line: #284050;
  --acc: #3bb7cc; --acc-ink: #7fd6e4; --acc-soft: #11313a; --ok: #3ccf7c; --ok-soft: #13301f; --no: #ff9a6b; --no-soft: #3a1d12;
  --hero: #0a2a33; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0d1720; --soft: #15222d; --soft2: #1b2b38; --ink: #e8eef3; --muted: #9db0bd; --line: #284050;
  --acc: #3bb7cc; --acc-ink: #7fd6e4; --acc-soft: #11313a; --ok: #3ccf7c; --ok-soft: #13301f; --no: #ff9a6b; --no-soft: #3a1d12;
  --hero: #0a2a33; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 18px/1.55 var(--font) }
button, input { font: inherit; color: inherit }
a { color: var(--acc-ink) }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px }
sub { font-size: .72em; line-height: 0 }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

#top { position: sticky; top: 0; z-index: 20; background: var(--hero); color: #fff; padding-top: env(safe-area-inset-top, 0px) }
#top .t { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 52px; font: 600 15px/1.3 var(--font) }
#top .t span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
#top a { color: #bfeaf2; text-decoration: none; white-space: nowrap; font-weight: 600; padding: 8px 0 }
#top .dots { max-width: 760px; margin: 0 auto; display: flex; gap: 5px; padding-bottom: 10px }
#top .dots i { flex: 1; height: 5px; border-radius: 9px; background: rgba(255,255,255,.22) }
#top .dots i.on { background: #8fdcea }

main { max-width: 760px; margin: 0 auto; padding-top: 18px; padding-bottom: 130px }
.kick { font: 600 13px/1.2 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px }
.kick.stop { color: var(--acc-ink) }
h1, h2 { font-family: var(--display); font-weight: 800; letter-spacing: -.01em; margin: 0 0 12px; text-wrap: balance }
h1 { font-size: clamp(28px, 7vw, 38px); line-height: 1.08 }
h2 { font-size: clamp(23px, 5.6vw, 30px); line-height: 1.15 }
p { margin: 0 0 12px }
.lead p { font-size: 18px }
.pen { font-size: 15px; color: var(--muted); margin: -4px 0 12px }

.fig { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin: 14px 0; text-align: center }
.fig svg { width: 100% !important; height: auto !important; max-height: 62vh; display: block; margin: 0 auto }
.fig .lay-a { display: none }
.fig.show-a .lay-a { display: inline }
.fig.wide { overflow-x: auto; -webkit-overflow-scrolling: touch }
.fig.wide svg { min-width: 620px; max-height: none }
.fig .swipe { display: none; font: 600 13px var(--font); color: #556673; margin: 4px 0 0; text-align: left }
@media (max-width: 640px) { .fig.wide .swipe { display: block } }

ol.rules { list-style: none; padding: 0; margin: 4px 0 14px; display: grid; gap: 8px }
ol.rules li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 16.5px; line-height: 1.45 }
.badge { width: 26px; height: 26px; border-radius: 50%; background: #1d2433; color: #fff; display: grid; place-items: center; font: 700 14px/1 var(--font); margin-top: 1px }
:root[data-theme="dark"] .badge { background: #e8eef3; color: #0d1720 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { background: #e8eef3; color: #0d1720 } }

.q { background: var(--soft); border-radius: 14px; padding: 14px 16px; margin: 0 0 12px; font-size: 17px }
.q .src { display: block; font-size: 13.5px; color: var(--muted); margin-top: 8px }
details.q summary { cursor: pointer; font-weight: 600; list-style: none }
details.q summary::-webkit-details-marker { display: none }
details.q summary::after { content: ' ▾'; color: var(--muted) }
details.q[open] summary::after { content: ' ▴' }
details.q[open] summary { margin-bottom: 8px }

.choices { display: grid; gap: 10px; margin: 6px 0 12px }
.choices button { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 13px 15px; min-height: 52px; cursor: pointer; font-size: 16.5px; line-height: 1.4 }
.choices button:hover { border-color: var(--acc) }
.choices button.right { border-color: var(--ok); background: var(--ok-soft) }
.choices button.wrong { border-color: var(--no); background: var(--no-soft) }
.choices button:disabled { cursor: default }
.choices.short { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) }
.choices.short button { text-align: center; font-weight: 600 }

.numrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 12px }
.numrow label { flex-basis: 100%; font-size: 15px; color: var(--muted) }
.numrow input { width: 9.5em; min-height: 52px; border: 2px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 20px; background: var(--paper) }
.numrow input:focus { border-color: var(--acc); outline: none }
.numrow .unit { font-weight: 600; font-size: 18px; min-width: 2ch }
.btn { min-height: 50px; border-radius: 99px; border: 0; padding: 0 22px; font-weight: 700; font-size: 17px; cursor: pointer; background: var(--acc); color: #fff }
:root[data-theme="dark"] .btn { color: #062027 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #062027 } }
.btn.ghost { background: transparent; color: var(--acc-ink); border: 1.5px solid var(--line) }
.fb { border-radius: 14px; padding: 12px 15px; margin: 4px 0 12px; font-size: 16.5px }
.fb.ok { background: var(--ok-soft); border-left: 5px solid var(--ok) }
.fb.no { background: var(--no-soft); border-left: 5px solid var(--no) }
.fb.show { background: var(--soft); border-left: 5px solid var(--muted) }
.fb b.h { display: block; margin-bottom: 2px }
.fb .act { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px }

.memo { border: 1px solid var(--line); border-radius: 14px; padding: 6px 0; margin: 10px 0 12px }
.memo .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; padding: 7px 14px; align-items: baseline; animation: in .25s ease-out }
.memo .row + .row { border-top: 1px dashed var(--line) }
.memo .lab { font-weight: 600; color: var(--muted); font-size: 15px }
.memo .x { font-size: 17px }
.memo .tk { color: var(--ok); font-weight: 700; white-space: nowrap }
.memo .side { grid-column: 2 / 4; font-size: 14px; color: var(--muted); margin-top: -2px }
.memo .row.waiting .x { color: var(--muted); font-style: italic }
.memo .empty { padding: 8px 14px; color: var(--muted); font-size: 15px }
@media (max-width: 420px) { .memo .row { grid-template-columns: 1fr auto } .memo .lab { grid-column: 1 / 3 } .memo .side { grid-column: 1 / 3 } }
@keyframes in { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .memo .row { animation: none } }
.askbox { border: 2px solid var(--acc); border-radius: 14px; padding: 12px 14px; margin: 6px 0 12px; background: var(--acc-soft) }
.askbox .p { font-weight: 600; margin: 0 0 4px }
.why { background: var(--soft); border-radius: 14px; padding: 12px 15px; margin: 6px 0 12px; font-size: 16.5px }
.why button { margin-top: 8px }
.note { font-size: 15px; color: var(--muted) }

ul.can { padding-left: 0; list-style: none; display: grid; gap: 10px; margin: 6px 0 18px }
ul.can li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 17px }
ul.can li::before { content: '✓'; color: var(--ok); font-weight: 800 }

.list { display: grid; gap: 10px; margin: 12px 0 }
.list a { display: block; text-decoration: none; color: var(--ink); background: var(--soft); border-radius: 14px; padding: 14px 16px }
.list a b { display: block; font-weight: 600 }
.list a small { color: var(--muted); font-size: 14px }

#bot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)) }
#bot .b { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center }
#bot button { min-height: 52px; border-radius: 99px; font: 700 17px var(--font); padding: 0 20px; cursor: pointer; white-space: nowrap }
#prev { background: transparent; color: var(--ink); border: 1.5px solid var(--line) }
#next { background: var(--acc); color: #fff; border: 0; margin-left: auto }
:root[data-theme="dark"] #next { color: #062027 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #next { color: #062027 } }
#next:disabled { background: var(--soft2); color: var(--muted); cursor: not-allowed }
#next.glow { box-shadow: 0 0 0 4px var(--acc-soft) }
#bot .hint { font-size: 14px; color: var(--muted); margin-left: auto; text-align: right; line-height: 1.3 }
#bot .hint + #next { margin-left: 0 }
@media (max-width: 380px) { #bot .hint { display: none } #next { margin-left: auto !important } }
</style>
</head>
<body>
<div id="top" class="gut"><div class="t"><span id="ttl">Watch · Circuits</span><a id="close" href="../app/">✕ Close</a></div><div class="dots" id="dots"></div></div>
<main id="main" class="gut" tabindex="-1"><p class="note">Loading the lesson…</p></main>
<div id="bot" class="gut" hidden><div class="b"><button id="prev" type="button">‹ Back</button><span class="hint" id="bhint"></span><button id="next" type="button">Next ›</button></div></div>
<script src="js/learn.js"></script>
</body>
</html>
