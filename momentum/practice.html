<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<title>Momentum practice · Mr R Science</title>
<meta name="description" content="Fresh momentum questions set out as in the IEB paper: formula, substitution, answer with unit and direction. Help opens only after you try.">
<link rel="stylesheet" href="../circuits/css/studio.css">
<meta name="theme-color" content="#0b7285">
<style>
  .posdir { margin: 6px 0 4px; }
  .ansrow { flex-wrap: wrap; }
  .ansrow input.ansn { flex: 1 1 6em; min-width: 6em; }
  .ansrow select.dir { flex: 1 1 10em; }
  .pcanvas svg { width: 100%; max-width: 560px; }
  .rule { border-left: 4px solid #0b7285; padding: 8px 12px; background: #f2f9fa; border-radius: 6px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">
      <span class="eyebrow">Physical Sciences · Momentum and impulse</span>
      <b>Momentum practice</b>
      <small>Size, unit and direction, every time</small>
    </a>
    <div class="row"><a class="btn ghost small" href="./">Momentum Studio</a></div>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer class="foot">
  <div class="wrap">Part of Mr R Science. No sign-in needed and nothing is sent anywhere: your practice stays in this browser.</div>
</footer>
<script src="../circuits/js/fmt.js"></script>
<script src="../circuits/js/noise.js"></script>
<script src="js/mgens.js?v=20261125b"></script>
<script src="../circuits/js/coach.js?v=20261125b"></script>
<script src="../circuits/js/practice.js?v=20261125b"></script>
<script>
/* Momentum on the keeper practice engine (25 Nov 2026). Routes: #home, #practise/<kind or M1/M2>?star=1-3, #check/<M1|M2>. */
(function () {
  'use strict';
  var M = window.MomentumGens, P = window.Practice, main = document.getElementById('main');
  var BANK = { gens: M, units: ['kg·m·s⁻¹', 'N·s', 'N', 'm·s⁻¹', 'kg', 'J', 's'], unitName: {}, museum: {}, picture: M.picture, key: 'mom-practice-v1', pack: 'momentum' };
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'text') el.textContent = attrs[k];
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null && attrs[k] !== false) el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  var ctx = { h: h, main: main, grade: function () { return 12; } };
  var RULE = 'Choose your positive direction first. The answer is a size, a unit and a direction. If your result is negative, write it on its own line, then the size with what the negative means: never a negative and a direction on the same line.';

  function parse() {
    var hash = location.hash.replace(/^#/, '') || 'home', q = hash.split('?'), path = q[0].split('/'), params = {};
    (q[1] || '').split('&').forEach(function (kv) { if (kv) { var p = kv.split('='); params[p[0]] = decodeURIComponent(p[1] || ''); } });
    return { view: path[0], arg: path[1], params: params };
  }
  function pool(arg) { return M.STREAMS[arg] ? M.STREAMS[arg] : M.GEN[arg] ? [arg] : M.STREAMS.M1; }
  function topicOf(arg) { return M.STREAMS[arg] ? arg : M.GEN[arg] ? M.GEN[arg].topic : 'M1'; }

  function home() {
    document.title = 'Momentum practice · Mr R Science';
    main.appendChild(h('div', { class: 'wrap' }, [h('h1', { text: 'Momentum practice' }),
      h('p', { text: 'Fresh questions every time, set out as in the paper. Hints open after you try; the worked answer is its own step, then a fresh question.' }),
      h('p', { class: 'small rule', text: RULE })].concat(Object.keys(M.STREAMS).map(function (t) {
        return h('div', { class: 'card' }, [h('h2', { text: M.TOPIC_NAME[t] }),
          h('div', { class: 'grid' }, M.STREAMS[t].map(function (id) { return h('a', { class: 'card pcard', href: '#practise/' + id }, [h('h3', { text: M.GEN[id].title }), h('p', { class: 'small muted', text: 'Three levels' })]); })),
          h('div', { class: 'row', style: 'margin-top:12px' }, [h('a', { class: 'btn ghost', href: '#practise/' + t, text: 'Mixed practice' }), h('a', { class: 'btn', href: '#check/' + t, text: 'Check it on my own' })])]);
      }))));
  }

  function practise(arg, params) {
    var ids = pool(arg), t = topicOf(arg), d = P.load(BANK.key), star = +(params.star || (d.star && d.star[arg]) || 1);
    document.title = 'Practise: ' + (M.GEN[arg] ? M.GEN[arg].title : M.TOPIC_NAME[t]) + ' · Mr R Science';
    var stars = h('div', { class: 'seg', role: 'group', 'aria-label': 'Level' }, [1, 2, 3].map(function (s) {
      return h('button', { 'aria-pressed': String(s === star), text: '★★★'.slice(0, s), title: ['One step', 'Two or three steps', 'An exam-level twist'][s - 1], onclick: function () {
        var dd = P.load(BANK.key); dd.star = dd.star || {}; dd.star[arg] = s; P.save(dd, BANK.key); star = s;
        Array.prototype.forEach.call(stars.querySelectorAll('button'), function (b, i) { b.setAttribute('aria-pressed', String(i + 1 === s)); }); next(); } });
    }));
    main.appendChild(h('div', { class: 'wrap' }, [h('div', { class: 'row' }, [h('a', { class: 'chip', href: '#home', text: '← Momentum practice' })]),
      h('h1', { text: 'Practise: ' + (M.GEN[arg] ? M.GEN[arg].title : M.TOPIC_NAME[t]), style: 'margin-top:10px' }),
      h('p', { class: 'small rule', text: RULE }),
      h('div', { class: 'card' }, [h('div', { class: 'row' }, [h('span', { class: 'small b', text: 'Level' }), stars])])]));
    var area = h('div', { class: 'wrap' }), nextBar = h('div', { class: 'wrap' }), clean = 0;
    main.appendChild(area); main.appendChild(nextBar);
    function next() {
      area.innerHTML = '';
      var id = ids[Math.floor(Math.random() * ids.length)], it = M.make(id, Math.floor(Math.random() * 1e9), 12, star);
      window.__item = it;
      area.appendChild(h('div', { class: 'row' }, [h('span', { class: 'chip', text: it.title }), h('span', { class: 'chip', text: '★★★'.slice(0, it.star) })]));
      P.mountItem(area, it, ctx, { mode: 'practice', bank: BANK, onDone: function (ok) {
        clean = ok ? clean + 1 : 0;
        area.appendChild(h('div', { class: 'row', style: 'margin-top:12px' }, [h('button', { class: 'btn', text: 'A fresh one', onclick: function () { next(); window.scrollTo(0, 0); } })]));
        nextBar.innerHTML = '';
        if (clean >= 2) nextBar.appendChild(h('a', { class: 'btn nextbar', href: '#check/' + t, text: 'Now check this: Check it on my own ›' }));
      } });
    }
    next();
  }

  function check(arg) {
    var t = M.STREAMS[arg] ? arg : 'M1', ids = M.STREAMS[t];
    document.title = 'Check it on my own: ' + M.TOPIC_NAME[t] + ' · Mr R Science';
    var wrap = h('div', { class: 'wrap' }, [h('div', { class: 'row' }, [h('a', { class: 'chip', href: '#home', text: '← Momentum practice' }), h('span', { class: 'chip', text: 'Help off' })]),
      h('h1', { text: 'Check it on my own: ' + M.TOPIC_NAME[t], style: 'margin-top:10px' }),
      h('p', { text: 'Three fresh questions, no help. Write your working on paper first, then fill in each line. Marks and worked answers come after you submit.' }),
      h('p', { class: 'small rule', text: RULE })]);
    main.appendChild(wrap);
    var mounted = [];
    for (var k = 0; k < 3; k++) {
      var id = ids[(k + Math.floor(Math.random() * ids.length)) % ids.length], it = M.make(id, Math.floor(Math.random() * 1e9), 12, 2);
      wrap.appendChild(h('h2', { text: 'Question ' + (k + 1), style: 'margin-top:18px' }));
      mounted.push({ it: it, m: P.mountItem(wrap, it, ctx, { mode: 'check', bank: BANK }) });
    }
    var res = h('div', {});
    var btn = h('button', { class: 'btn', text: 'Mark my answers', onclick: function () {
      var got = 0, of = 0, answered = false;
      mounted.forEach(function (x) { var r = x.m.score(); got += r.got; of += r.of; answered = answered || r.answered; P.log({ g: 12, topic: x.it.topic, gen: x.it.gen, src: 'check', ok: r.got === r.of }, BANK.key); });
      btn.disabled = true; res.innerHTML = '';
      res.appendChild(h('div', { class: got / of >= 2 / 3 ? 'okc' : 'warnc' }, [h('b', { text: 'Marks: ' + got + '/' + of + '. ' }),
        document.createTextNode(got / of >= 2 / 3 ? 'Done on your own. Come back to this in a few days.' : 'Practise the kinds you dropped marks on, then check again.')]));
      res.appendChild(h('div', { class: 'row', style: 'margin-top:10px' }, [h('a', { class: 'btn ghost', href: '#practise/' + t, text: 'Practise ' + M.TOPIC_NAME[t] }), h('button', { class: 'btn ghost', text: 'A fresh check', onclick: route })]));
    } });
    wrap.appendChild(h('div', { class: 'row', style: 'margin-top:14px' }, [btn])); wrap.appendChild(res);
  }

  function route() {
    var r = parse(); main.innerHTML = ''; window.scrollTo(0, 0);
    if (r.view === 'practise') practise(r.arg || 'M1', r.params);
    else if (r.view === 'check') check(r.arg);
    else home();
    main.focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
<script src="/app/back.js"></script>
</body>
</html>
